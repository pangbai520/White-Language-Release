name: White Language Global Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm-llvm-cache:
    name: Cache LLVM for ${{ matrix.os_name }}
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            llvm_repo: mstorsjo/llvm-mingw
            asset_keyword: ucrt-x86_64.zip
            archive_name: llvm.zip

          - os_name: macos-arm64
            runner: macos-14
            llvm_repo: llvm/llvm-project
            asset_keyword: macOS-ARM64.tar.xz
            archive_name: llvm.tar.xz

          - os_name: linux-x64
            runner: ubuntu-latest
            llvm_repo: llvm/llvm-project
            asset_keyword: Linux-X64.tar.xz
            archive_name: llvm.tar.xz

    steps:
      - name: Find LLVM release asset
        id: get_llvm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo ${{ matrix.llvm_repo }} --json assets -q '[.assets[] | select(.name | contains("${{ matrix.asset_keyword }}")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No LLVM asset matched '${{ matrix.asset_keyword }}'."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Cache complete LLVM archive
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: .llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}
          key: llvm-archive-v1-${{ matrix.os_name }}-${{ steps.get_llvm.outputs.url }}

      - name: Download complete LLVM archive
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ".llvm-cache/${{ matrix.os_name }}"
          curl --fail --location --retry 3 --output ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" "${{ steps.get_llvm.outputs.url }}"
          test -s ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}"

  build-and-package:
    name: Build for ${{ matrix.os_name }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            artifact: WhiteLanguage-Windows-x64-Setup.exe
            llvm_repo: mstorsjo/llvm-mingw
            asset_keyword: ucrt-x86_64.zip
            archive_name: llvm.zip
            target_arch: x86_64

          - os_name: macos-arm64
            runner: macos-14
            artifact: whitelang-macos-arm64.tar.gz
            llvm_repo: llvm/llvm-project
            asset_keyword: macOS-ARM64.tar.xz
            archive_name: llvm.tar.xz
            target_arch: aarch64

          - os_name: linux-x64
            runner: ubuntu-latest
            artifact: whitelang-linux-x64.tar.gz
            llvm_repo: llvm/llvm-project
            asset_keyword: Linux-X64.tar.xz
            archive_name: llvm.tar.xz
            target_arch: x86_64

    steps:
      - name: Set Version Variable
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "TARGET_REF=main" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          else
            echo "TARGET_REF=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Checkout White Language Source
        uses: actions/checkout@v4
        with:
          repository: 'pangbai520/White-Language'
          path: 'source_repo'
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Remove Blacklisted Folders
        shell: bash
        run: |
          BLACKLIST_DIRS="docs tools"

          echo "Applying blacklist deletions in source_repo..."
          cd source_repo
          for dir in $BLACKLIST_DIRS; do
            if [ -e "$dir" ]; then
              echo "Removing blacklisted item: $dir"
              rm -rf "$dir"
            fi
          done

      - name: Create Package Layout
        shell: bash
        run: |
          mkdir -p release_pkg/bin
          mkdir -p release_pkg/runtime
          mkdir -p release_pkg/tools/llvm/bin
          mkdir -p Output Output_Snapshots
          mkdir -p release_pkg/std

      - name: Find LLVM release asset
        id: get_llvm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo ${{ matrix.llvm_repo }} --json assets -q '[.assets[] | select(.name | contains("${{ matrix.asset_keyword }}")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No LLVM asset matched '${{ matrix.asset_keyword }}'."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Restore complete LLVM archive
        id: restore-llvm
        uses: actions/cache/restore@v4
        with:
          path: .llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}
          key: llvm-archive-v1-${{ matrix.os_name }}-${{ steps.get_llvm.outputs.url }}

      - name: Download LLVM archive on cache miss
        if: steps.restore-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "LLVM was not present in the default-branch cache; downloading it for this build."
          mkdir -p ".llvm-cache/${{ matrix.os_name }}"
          curl --fail --location --retry 3 --output ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" "${{ steps.get_llvm.outputs.url }}"
          test -s ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}"

      - name: "[Windows] Stage LLVM toolchain"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        run: |
          rm -rf llvm_full
          mkdir -p llvm_full
          unzip -q ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" -d llvm_full
          LLVM_ROOT=$(find llvm_full -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$LLVM_ROOT" ] || [ ! -f "$LLVM_ROOT/bin/clang.exe" ]; then
            echo "::error::The cached LLVM archive does not contain a complete Windows toolchain."
            exit 1
          fi
          rm -rf release_pkg/tools/llvm
          mv "$LLVM_ROOT" release_pkg/tools/llvm
          rm -rf llvm_full

      - name: "[Unix] Stage LLVM toolchain"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        run: |
          rm -rf llvm_full
          mkdir -p llvm_full
          tar -xf ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" -C llvm_full --strip-components=1
          if [ ! -f "llvm_full/bin/clang" ] || [ ! -d "llvm_full/lib/clang" ]; then
            echo "::error::The cached LLVM archive does not contain a complete Unix toolchain."
            exit 1
          fi
          mkdir -p release_pkg/tools/llvm/bin release_pkg/tools/llvm/lib
          cp -a llvm_full/bin/clang llvm_full/bin/clang-[0-9]* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/ld.lld* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/lld* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/llvm-objdump* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/lib/clang release_pkg/tools/llvm/lib/
          rm -rf llvm_full

      - name: "[Windows] Bootstrap Compiler & Build Runtime"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p boot_env boot_dl
          PREV_TAG=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName' | grep -v "^${{ github.ref_name }}$" | grep -v "snapshot" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a valid previous release tag to bootstrap from."
            exit 1
          fi

          echo "Bootstrapping from previous release: $PREV_TAG"
          gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "WhiteLanguage-Windows-x64-Portable-*.zip" --dir boot_dl --clobber
          unzip -q boot_dl/*.zip -d boot_env

          GLOBAL_LLVM_BIN_ROOT=$(cygpath -m "$PWD/release_pkg/tools/llvm/bin")
          rm -f wlc_icon.res
          if [ -f "wlc.rc" ]; then
            "$GLOBAL_LLVM_BIN_ROOT/windres.exe" wlc.rc -O coff -o wlc_icon.res || true
          fi

          ICON_PATH_ABS=""
          if [ -f "wlc_icon.res" ]; then
            ICON_PATH_ABS=$(cygpath -m "$PWD/wlc_icon.res")
          fi

          cd source_repo
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          COMMITS=$(git rev-list --reverse ${PREV_TAG}..${{ github.ref_name }})
          FINAL_COMMIT=$(git rev-parse "${{ github.ref_name }}^{commit}")

          GLOBAL_LLVM_BIN=$(cygpath -m "$PWD/../release_pkg/tools/llvm/bin")
          export PATH="$GLOBAL_LLVM_BIN:$PATH"

          ACTIVE_WLC=$(cygpath -m "$(find "$PWD/../boot_env" -name wlc.exe | head -n 1)")
          ACTIVE_ENV=$(cygpath -m "$(dirname $(dirname "$ACTIVE_WLC"))")

          for COMMIT in $COMMITS; do
            SHORT_SHA=$(git rev-parse --short $COMMIT)
            echo "------------------------------------------------"
            echo "Bootstrapping Commit: $SHORT_SHA"
            git checkout $COMMIT
            cp -a "$ACTIVE_ENV/std" "$ACTIVE_ENV/std_backup"
            cp -a "$ACTIVE_ENV/runtime" "$ACTIVE_ENV/runtime_backup"


            "$GLOBAL_LLVM_BIN/clang.exe" -c runtime/wl_runtime.c -o "$ACTIVE_ENV/runtime/wl_runtime_new.obj" -O2

            export WL_PATH="$ACTIVE_ENV"
            mkdir -p ../build_${SHORT_SHA}/bin ../build_${SHORT_SHA}/std ../build_${SHORT_SHA}/runtime
            cp -r ../release_pkg/tools ../build_${SHORT_SHA}/

            ICON_ARG=""
            if [ -n "$ICON_PATH_ABS" ]; then
              ICON_ARG="$ICON_PATH_ABS"
            fi

            apply_env() {
              rm -rf "$ACTIVE_ENV/std" "$ACTIVE_ENV/runtime/wl_runtime.obj"
              mkdir -p "$ACTIVE_ENV/std"
              if [ "$1" == "new_std" ]; then cp -rf std/* "$ACTIVE_ENV/std/" 2>/dev/null || true; else cp -a "$ACTIVE_ENV/std_backup/." "$ACTIVE_ENV/std/"; fi
              if [ "$2" == "new_rt" ]; then cp "$ACTIVE_ENV/runtime/wl_runtime_new.obj" "$ACTIVE_ENV/runtime/wl_runtime.obj"; else cp "$ACTIVE_ENV/runtime_backup/wl_runtime.obj" "$ACTIVE_ENV/runtime/wl_runtime.obj"; fi
            }

            echo "Stage 1: Trying [New STD + New RT]..."
            apply_env new_std new_rt
            if "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
              echo "[New STD + New RT] succeeded."
            else
              echo "Failed. Trying [New STD + Old RT]..."
              apply_env new_std old_rt
              if "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                echo "[New STD + Old RT] succeeded."
              else
                echo "Failed. Trying [Old STD + New RT]..."
                apply_env old_std new_rt
                if "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                  echo "[Old STD + New RT] succeeded."
                else
                  echo "Failed. Trying [Old STD + Old RT]..."
                  apply_env old_std old_rt
                  if ! "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                    echo "All fallback combinations failed!"
                    exit 1
                  fi
                  echo "[Old STD + Old RT] succeeded."
                fi
              fi
            fi

            echo "Stage 2: Finalizing with latest STD & RT..."
            apply_env new_std new_rt
            "../build_${SHORT_SHA}/bin/wlc_temp.exe" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc.exe -Oz
            rm -f ../build_${SHORT_SHA}/bin/wlc_temp.exe "$ACTIVE_ENV/runtime/wl_runtime_new.obj"
            rm -rf "$ACTIVE_ENV/std_backup" "$ACTIVE_ENV/runtime_backup"

            cp "$ACTIVE_ENV/runtime/wl_runtime.obj" ../build_${SHORT_SHA}/runtime/wl_runtime.obj
            cp -r std/* ../build_${SHORT_SHA}/std/

            ACTIVE_WLC=$(cygpath -m "$PWD/../build_${SHORT_SHA}/bin/wlc.exe")
            ACTIVE_ENV=$(cygpath -m "$PWD/../build_${SHORT_SHA}")

            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              cp "$ACTIVE_WLC" ../release_pkg/bin/
              cp ../build_${SHORT_SHA}/runtime/wl_runtime.obj ../release_pkg/runtime/
              cp -r std/* ../release_pkg/std/
            else
              SNAP_NAME="${{ matrix.os_name }}-${VERSION_NO_V}-snapshot-${SHORT_SHA}"
              cd ../build_${SHORT_SHA}
              7z a -tzip ../Output_Snapshots/${SNAP_NAME}.zip bin std runtime > /dev/null
              cd ../source_repo
            fi
          done
          git checkout ${{ env.TARGET_REF }}

          echo "================================================"
          echo " Starting Compiler Idempotency Check (Assembly)"
          echo "================================================"
          export WL_PATH=$(cygpath -m "$PWD/../release_pkg")
          OBJDUMP_CMD="$GLOBAL_LLVM_BIN/llvm-objdump.exe"
          WLC_CURRENT=$(cygpath -m "$PWD/../release_pkg/bin/wlc.exe")
          WLC_NEXT=$(cygpath -m "$PWD/../release_pkg/bin/wlc_next.exe")
          clean_objdump() {
            "$OBJDUMP_CMD" -d "$1" | awk '!/file format/ && NF' > "$2"
          }

          clean_objdump "$WLC_CURRENT" "../wlc_current.asm"

          MATCH=false
          for TRY in 1 2 3; do
            echo "Fixpoint Try #$TRY..."
            "$WLC_CURRENT" src/wlc.wl $ICON_ARG -o "$WLC_NEXT" -Oz
            clean_objdump "$WLC_NEXT" "../wlc_next.asm"

            if diff -u "../wlc_current.asm" "../wlc_next.asm" > ../diff.log; then
              echo "Assembly strictly matches! Fixpoint reached at try #$TRY."
              MATCH=true
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              break
            else
              echo "Assembly mismatch on try #$TRY. Diff preview (first 20 lines):"
              head -n 20 ../diff.log
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              mv -f "../wlc_next.asm" "../wlc_current.asm"
            fi
          done

          rm -f ../wlc_current.asm ../wlc_next.asm ../diff.log
          if [ "$MATCH" = false ]; then
            echo "::error::Compiler failed to reach fixpoint after 3 tries. Assembly still diverges!"
            exit 1
          fi

          echo ""
          echo "================================================"
          echo " Starting C Runtime Determinism Check (Assembly)"
          echo "================================================"
          RT_CURRENT=$(cygpath -m "$PWD/../release_pkg/runtime/wl_runtime.obj")
          RT_NEXT=$(cygpath -m "$PWD/../release_pkg/runtime/wl_runtime_next.obj")

          clean_objdump "$RT_CURRENT" "../rt_current.asm"
          "$GLOBAL_LLVM_BIN/clang.exe" -c runtime/wl_runtime.c -o "$RT_NEXT" -O2
          clean_objdump "$RT_NEXT" "../rt_next.asm"

          if diff -u "../rt_current.asm" "../rt_next.asm" > ../diff_rt.log; then
            echo "C Runtime assembly strictly matches! Deterministic build confirmed."
          else
            echo "::error::C Runtime assembly mismatch! Compilation is non-deterministic."
            head -n 20 ../diff_rt.log
            exit 1
          fi
          rm -f ../rt_current.asm ../rt_next.asm ../diff_rt.log "$RT_NEXT"

      - name: "[Unix] Bootstrap Compiler & Build Runtime"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p boot_env boot_dl
          PREV_TAG=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName' | grep -v "^${{ github.ref_name }}$" | grep -v "snapshot" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a valid previous release tag to bootstrap from."
            exit 1
          fi

          echo "Bootstrapping from previous release: $PREV_TAG"
          gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "whitelang-${{ matrix.os_name }}-*.tar.gz" --dir boot_dl --clobber
          tar -xzf boot_dl/*.tar.gz -C boot_env

          cd source_repo
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          COMMITS=$(git rev-list --reverse ${PREV_TAG}..${{ github.ref_name }})
          FINAL_COMMIT=$(git rev-parse "${{ github.ref_name }}^{commit}")

          GLOBAL_LLVM_BIN="$PWD/../release_pkg/tools/llvm/bin"
          export PATH="$GLOBAL_LLVM_BIN:$PATH"

          ACTIVE_WLC="$PWD/../boot_env/bin/wlc"
          ACTIVE_ENV="$PWD/../boot_env"
          chmod +x "$ACTIVE_WLC"

          if [ "${{ matrix.os_name }}" == "macos-arm64" ]; then
            export SDKROOT=$(xcrun --show-sdk-path)
          fi

          for COMMIT in $COMMITS; do
            SHORT_SHA=$(git rev-parse --short $COMMIT)
            echo "------------------------------------------------"
            echo "Bootstrapping Commit: $SHORT_SHA"
            git checkout $COMMIT

            cp -a "$ACTIVE_ENV/std" "$ACTIVE_ENV/std_backup"
            cp -a "$ACTIVE_ENV/runtime" "$ACTIVE_ENV/runtime_backup"

            "$GLOBAL_LLVM_BIN/clang" -c runtime/wl_runtime.c -o "$ACTIVE_ENV/runtime/wl_runtime_new.o" -O2

            export WL_PATH="$ACTIVE_ENV"
            mkdir -p ../build_${SHORT_SHA}/bin ../build_${SHORT_SHA}/std ../build_${SHORT_SHA}/runtime
            cp -r ../release_pkg/tools ../build_${SHORT_SHA}/

            apply_env() {
              rm -rf "$ACTIVE_ENV/std" "$ACTIVE_ENV/runtime/wl_runtime.o"
              mkdir -p "$ACTIVE_ENV/std"
              if [ "$1" == "new_std" ]; then cp -rf std/* "$ACTIVE_ENV/std/" 2>/dev/null || true; else cp -a "$ACTIVE_ENV/std_backup/." "$ACTIVE_ENV/std/"; fi
              if [ "$2" == "new_rt" ]; then cp "$ACTIVE_ENV/runtime/wl_runtime_new.o" "$ACTIVE_ENV/runtime/wl_runtime.o"; else cp "$ACTIVE_ENV/runtime_backup/wl_runtime.o" "$ACTIVE_ENV/runtime/wl_runtime.o"; fi
            }

            echo "Stage 1: Trying [New STD + New RT]..."
            apply_env new_std new_rt
            if "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
              echo "[New STD + New RT] succeeded."
            else
              echo "Failed. Trying [New STD + Old RT]..."
              apply_env new_std old_rt
              if "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                echo "[New STD + Old RT] succeeded."
              else
                echo "Failed. Trying [Old STD + New RT]..."
                apply_env old_std new_rt
                if "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                  echo "[Old STD + New RT] succeeded."
                else
                  echo "Failed. Trying [Old STD + Old RT]..."
                  apply_env old_std old_rt
                  if ! "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                    echo "All fallback combinations failed!"
                    exit 1
                  fi
                  echo "[Old STD + Old RT] succeeded."
                fi
              fi
            fi

            echo "Stage 2: Finalizing with latest STD & RT..."
            apply_env new_std new_rt
            "../build_${SHORT_SHA}/bin/wlc_temp" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc -Oz
            rm -f ../build_${SHORT_SHA}/bin/wlc_temp "$ACTIVE_ENV/runtime/wl_runtime_new.o"
            rm -rf "$ACTIVE_ENV/std_backup" "$ACTIVE_ENV/runtime_backup"

            cp "$ACTIVE_ENV/runtime/wl_runtime.o" ../build_${SHORT_SHA}/runtime/wl_runtime.o
            cp -r std/* ../build_${SHORT_SHA}/std/

            ACTIVE_WLC="$PWD/../build_${SHORT_SHA}/bin/wlc"
            ACTIVE_ENV="$PWD/../build_${SHORT_SHA}"

            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              cp "$ACTIVE_WLC" ../release_pkg/bin/
              cp ../build_${SHORT_SHA}/runtime/wl_runtime.o ../release_pkg/runtime/
              cp -r std/* ../release_pkg/std/
            else
              SNAP_NAME="${{ matrix.os_name }}-${VERSION_NO_V}-snapshot-${SHORT_SHA}"
              cd ../build_${SHORT_SHA}
              tar -czf ../Output_Snapshots/${SNAP_NAME}.tar.gz bin std runtime
              cd ../source_repo
            fi
          done
          git checkout ${{ env.TARGET_REF }}

          echo "================================================"
          echo " Starting Compiler Idempotency Check (Assembly)"
          echo "================================================"
          export WL_PATH="$PWD/../release_pkg"
          OBJDUMP_CMD="$GLOBAL_LLVM_BIN/llvm-objdump"
          WLC_CURRENT="$PWD/../release_pkg/bin/wlc"
          WLC_NEXT="$PWD/../release_pkg/bin/wlc_next"

          clean_objdump() {
            "$OBJDUMP_CMD" -d "$1" | awk '!/file format/ && NF' > "$2"
          }

          clean_objdump "$WLC_CURRENT" "../wlc_current.asm"

          MATCH=false
          for TRY in 1 2 3; do
            echo "Fixpoint Try #$TRY..."
            "$WLC_CURRENT" src/wlc.wl -o "$WLC_NEXT" -Oz
            clean_objdump "$WLC_NEXT" "../wlc_next.asm"

            if diff -u "../wlc_current.asm" "../wlc_next.asm" > ../diff.log; then
              echo "Assembly strictly matches! Fixpoint reached at try #$TRY."
              MATCH=true
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              break
            else
              echo "Assembly mismatch on try #$TRY. Diff preview (first 20 lines):"
              head -n 20 ../diff.log
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              mv -f "../wlc_next.asm" "../wlc_current.asm"
            fi
          done

          rm -f ../wlc_current.asm ../wlc_next.asm ../diff.log
          if [ "$MATCH" = false ]; then
            echo "::error::Compiler failed to reach fixpoint after 3 tries. Assembly still diverges!"
            exit 1
          fi

          echo ""
          echo "================================================"
          echo " Starting C Runtime Determinism Check (Assembly)"
          echo "================================================"
          RT_CURRENT="$PWD/../release_pkg/runtime/wl_runtime.o"
          RT_NEXT="$PWD/../release_pkg/runtime/wl_runtime_next.o"

          clean_objdump "$RT_CURRENT" "../rt_current.asm"
          "$GLOBAL_LLVM_BIN/clang" -c runtime/wl_runtime.c -o "$RT_NEXT" -O2
          clean_objdump "$RT_NEXT" "../rt_next.asm"

          if diff -u "../rt_current.asm" "../rt_next.asm" > ../diff_rt.log; then
            echo "C Runtime assembly strictly matches! Deterministic build confirmed."
          else
            echo "::error::C Runtime assembly mismatch! Compilation is non-deterministic."
            head -n 20 ../diff_rt.log
            exit 1
          fi
          rm -f ../rt_current.asm ../rt_next.asm ../diff_rt.log "$RT_NEXT"

      - name: "[Windows] Prepare C FFI host"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          WLC="$PWD/release_pkg/bin/wlc.exe"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang.exe"
          FFI_DIR="$PWD/source_repo/tests/integration/ffi"

          cd "$FFI_DIR"
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_c_host.exe
          "$WLC" test_lib_export.wl --shared --ldflags "-Wl,--out-implib,test_lib_export.lib"
          "$CLANG" test_dll_host.c test_lib_export.lib -o test_c_host.exe
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp

      - name: "[Windows] Trim LLVM for release"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        run: |
          LLVM_DIR="release_pkg/tools/llvm"

          rm -rf $LLVM_DIR/python $LLVM_DIR/busybox $LLVM_DIR/share $LLVM_DIR/include $LLVM_DIR/LICENSE.TXT
          rm -rf $LLVM_DIR/aarch64-w64-mingw32 $LLVM_DIR/arm64ec-w64-mingw32 $LLVM_DIR/armv7-w64-mingw32 $LLVM_DIR/i686-w64-mingw32
          rm -rf $LLVM_DIR/x86_64-w64-mingw32/share $LLVM_DIR/x86_64-w64-mingw32/bin
          rm -rf $LLVM_DIR/lib/libear $LLVM_DIR/lib/libscanbuild

          CLANG_VER_DIR=$(ls -d $LLVM_DIR/lib/clang/* | head -n 1)
          rm -rf $CLANG_VER_DIR/lib/linux $CLANG_VER_DIR/include/*_wrappers $CLANG_VER_DIR/bin $CLANG_VER_DIR/share

          rm -f $LLVM_DIR/bin/libpython*.dll $LLVM_DIR/bin/aarch64-* $LLVM_DIR/bin/armv7-* $LLVM_DIR/bin/arm64ec-* $LLVM_DIR/bin/i686-* $LLVM_DIR/bin/*mingw32uwp*
          rm -f $LLVM_DIR/bin/lldb* $LLVM_DIR/bin/liblldb* $LLVM_DIR/bin/clang-format* $LLVM_DIR/bin/clang-tidy*
          rm -f $LLVM_DIR/bin/llvm-objdump* $LLVM_DIR/bin/llvm-pdbutil* $LLVM_DIR/bin/clangd* $LLVM_DIR/bin/clang-scan-deps*
          rm -f $LLVM_DIR/bin/clang-target-wrapper.exe $LLVM_DIR/bin/git-clang-format* $LLVM_DIR/bin/run-clang-tidy*
          rm -f $LLVM_DIR/bin/scan-build* $LLVM_DIR/bin/analyze-build* $LLVM_DIR/bin/intercept-build*
          rm -f $LLVM_DIR/bin/llvm-cov* $LLVM_DIR/bin/llvm-profdata* $LLVM_DIR/bin/llvm-ml* $LLVM_DIR/bin/llvm-symbolizer.exe $LLVM_DIR/bin/llvm-wrapper.exe

          rm -f $LLVM_DIR/bin/llvm-cxxfilt.exe $LLVM_DIR/bin/llvm-lib.exe $LLVM_DIR/bin/llvm-ranlib.exe $LLVM_DIR/bin/llvm-readelf.exe
          rm -f $LLVM_DIR/bin/llvm-rc.exe $LLVM_DIR/bin/llvm-cvtres.exe $LLVM_DIR/bin/llvm-dlltool.exe $LLVM_DIR/bin/llvm-readobj.exe
          rm -f $LLVM_DIR/bin/dlltool.exe $LLVM_DIR/bin/*-ar.exe $LLVM_DIR/bin/ar.exe $LLVM_DIR/bin/*-nm.exe $LLVM_DIR/bin/nm.exe
          rm -f $LLVM_DIR/bin/*-objcopy.exe $LLVM_DIR/bin/objcopy.exe $LLVM_DIR/bin/*-size.exe $LLVM_DIR/bin/size.exe
          rm -f $LLVM_DIR/bin/*-strings.exe $LLVM_DIR/bin/strings.exe $LLVM_DIR/bin/*-strip.exe $LLVM_DIR/bin/strip.exe
          rm -f $LLVM_DIR/bin/*addr2line.exe $LLVM_DIR/bin/objdump* $LLVM_DIR/bin/ranlib.exe $LLVM_DIR/bin/readelf.exe

          rm -f $LLVM_DIR/bin/{c11,c99,cc,gcc,c++,clang++,g++}.exe $LLVM_DIR/bin/*-c++.exe $LLVM_DIR/bin/*-clang++.exe $LLVM_DIR/bin/*-g++.exe
          rm -f $LLVM_DIR/bin/*.sh $LLVM_DIR/bin/x86_64-w64-mingw32-gcc.exe $LLVM_DIR/bin/gendef.exe $LLVM_DIR/bin/mingw32-make.exe $LLVM_DIR/bin/widl.exe $LLVM_DIR/bin/ld

          rm -f $LLVM_DIR/bin/libclang_rt.asan_dynamic-x86_64.dll $LLVM_DIR/bin/{libffi-8.dll,libomp.dll}

          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libd3d*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libd2d*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libx3d*.a
          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libxaudio*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libxinput*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libmf*.a
          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libwindows.*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libc++*.a

          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libntvdm*.a $LLVM_DIR/x86_64-w64-mingw32/lib/*fax*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libie*.a
          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libvss*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libbth*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libbluetooth*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libwlan*.a
          rm -f $LLVM_DIR/x86_64-w64-mingw32/lib/libiis*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libcryptui*.a $LLVM_DIR/x86_64-w64-mingw32/lib/libcryptxml*.a

      - name: "[Unix] Trim LLVM for release"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        run: |
          LLVM_BIN="release_pkg/tools/llvm/bin"
          if [ -d "$LLVM_BIN" ]; then
            rm -f $LLVM_BIN/llvm-objdump*
            if [[ "$OSTYPE" == "darwin"* ]]; then
              strip -x $LLVM_BIN/* 2>/dev/null || true
            else
              strip --strip-unneeded $LLVM_BIN/* 2>/dev/null || true
            fi
          fi

      - name: Run language, integration, and end-to-end tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [ "${{ matrix.os_name }}" == "macos-arm64" ]; then
            export SDKROOT=$(xcrun --show-sdk-path)
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          ERRORS=0
          FAILED_FILES=()

          while IFS= read -r -d '' file; do
            echo "Running test: $file"

            rm -f test_bin test_bin.exe
            if ! "$WLC" "$file" -o test_bin; then
              echo "::error file=$file::Compilation Failed"
              FAILED_FILES+=("[Compile Error] $file")
              ERRORS=$((ERRORS+1))
              continue
            fi

            if [ -f "test_bin.exe" ]; then
              TEST_BIN="./test_bin.exe"
            else
              TEST_BIN="./test_bin"
            fi

            set +e
            OUTPUT=$($TEST_BIN 2>&1)
            STATUS=$?
            set -e
            if [ $STATUS -ne 0 ] || ! grep -Fq "PASS:" <<< "$OUTPUT"; then
              echo "::error file=$file::Test Logic Failed"
              echo "Output: $OUTPUT"
              FAILED_FILES+=("[Runtime Error] $file")
              ERRORS=$((ERRORS+1))
            fi

            rm -f test_bin test_bin.exe
          done < <(find source_repo/tests -type f -name "*.wl" ! -path "*/ffi/*" ! -path "*/failures/*" ! -path "*/fixtures/*" -print0)

          if [ $ERRORS -ne 0 ]; then
            echo "------------------------------------------"
            echo "POSITIVE TEST SUMMARY: $ERRORS tests failed"
            for failed in "${FAILED_FILES[@]}"; do
              echo "  - $failed"
            done
            echo "------------------------------------------"
            exit 1
          fi
          echo "All language, integration, and end-to-end tests passed."

      - name: Run diagnostic tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [ "${{ matrix.os_name }}" == "macos-arm64" ]; then
            export SDKROOT=$(xcrun --show-sdk-path)
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          ERRORS=0
          FAILED_FILES=()

          while IFS= read -r -d '' file; do
            echo "Running diagnostic: $file"
            EXPECTED=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$file" | head -n 1)
            if [ -z "$EXPECTED" ]; then
              echo "::error file=$file::Missing Expected Error declaration"
              FAILED_FILES+=("[Missing Metadata] $file")
              ERRORS=$((ERRORS+1))
              continue
            fi

            rm -f diagnostic_bin diagnostic_bin.exe
            set +e
            BUILD_OUTPUT=$("$WLC" "$file" -o diagnostic_bin 2>&1)
            BUILD_STATUS=$?
            set -e
            RUN_OUTPUT=""
            RUN_STATUS=0

            if [ $BUILD_STATUS -eq 0 ]; then
              if [ -f "diagnostic_bin.exe" ]; then
                DIAGNOSTIC_BIN="./diagnostic_bin.exe"
              else
                DIAGNOSTIC_BIN="./diagnostic_bin"
              fi
              set +e
              RUN_OUTPUT=$($DIAGNOSTIC_BIN 2>&1)
              RUN_STATUS=$?
              set -e
            fi

            OUTPUT="$BUILD_OUTPUT"
            if [ -n "$RUN_OUTPUT" ]; then
              OUTPUT="${OUTPUT}"$'\n'"${RUN_OUTPUT}"
            fi

            if [ $BUILD_STATUS -eq 0 ] && [ $RUN_STATUS -eq 0 ]; then
              echo "::error file=$file::Test was expected to fail but completed successfully"
              echo "Expected: $EXPECTED"
              FAILED_FILES+=("[Unexpected Success] $file")
              ERRORS=$((ERRORS+1))
            elif ! grep -Fq "$EXPECTED" <<< "$OUTPUT"; then
              echo "::error file=$file::Expected diagnostic was not produced"
              echo "Expected: $EXPECTED"
              echo "Compiler exit: $BUILD_STATUS; program exit: $RUN_STATUS"
              echo "Output: $OUTPUT"
              FAILED_FILES+=("[Diagnostic Mismatch] $file")
              ERRORS=$((ERRORS+1))
            fi

            rm -f diagnostic_bin diagnostic_bin.exe
          done < <(find source_repo/tests/diagnostics/failures -type f -name "*.wl" -print0)

          if [ $ERRORS -ne 0 ]; then
            echo "------------------------------------------"
            echo "DIAGNOSTIC TEST SUMMARY: $ERRORS tests failed"
            for failed in "${FAILED_FILES[@]}"; do
              echo "  - $failed"
            done
            echo "------------------------------------------"
            exit 1
          fi
          echo "All diagnostic tests passed."

      - name: Run FFI tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [ "${{ matrix.os_name }}" == "macos-arm64" ]; then
            export SDKROOT=$(xcrun --show-sdk-path)
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang"
          [ -f "${CLANG}.exe" ] && CLANG="${CLANG}.exe"
          FFI_DIR="$PWD/source_repo/tests/integration/ffi"

          cd "$FFI_DIR"
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_lib_export.so libtest_lib_export.so libtest_lib_export.dylib
          rm -f test_wl_host test_wl_host.exe
          if [ "${{ matrix.os_name }}" != "windows-x64" ]; then
            rm -f test_c_host test_c_host.exe
          fi

          if [ "${{ matrix.os_name }}" == "windows-x64" ]; then
            "$WLC" test_lib_export.wl --shared --ldflags "-Wl,--out-implib,test_lib_export.lib"
          else
            "$WLC" test_lib_export.wl --shared
          fi

          if [ "${{ matrix.os_name }}" == "windows-x64" ]; then
            SHARED_LIB="test_lib_export.dll"
            WL_LINK_LIB="test_lib_export.lib"
            C_HOST="./test_c_host.exe"
            WL_HOST="test_wl_host.exe"
            if [ ! -f "$WL_LINK_LIB" ]; then
              echo "::error::Windows shared build did not produce the import library '$WL_LINK_LIB'."
              exit 1
            fi
          elif [ "${{ matrix.os_name }}" == "macos-arm64" ]; then
            SHARED_LIB="libtest_lib_export.dylib"
            WL_LINK_LIB="$SHARED_LIB"
            cp "$SHARED_LIB" test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,@loader_path -o test_c_host
            C_HOST="./test_c_host"
            WL_HOST="test_wl_host"
            export DYLD_LIBRARY_PATH="$PWD${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            SHARED_LIB="libtest_lib_export.so"
            WL_LINK_LIB="$SHARED_LIB"
            cp "$SHARED_LIB" test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,'$ORIGIN' -o test_c_host
            C_HOST="./test_c_host"
            WL_HOST="test_wl_host"
            export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi

          C_OUTPUT=$($C_HOST 2>&1)
          echo "$C_OUTPUT"
          grep -Fq "PASS:" <<< "$C_OUTPUT"

          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          PYTHON_OUTPUT=$($PYTHON test_dll_host.py 2>&1)
          echo "$PYTHON_OUTPUT"
          grep -Fq "PASS:" <<< "$PYTHON_OUTPUT"

          "$WLC" test_dll_host.wl "$WL_LINK_LIB" -o "$WL_HOST"
          WL_OUTPUT=$(./"$WL_HOST" 2>&1)
          echo "$WL_OUTPUT"
          grep -Fq "PASS:" <<< "$WL_OUTPUT"

          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_lib_export.so libtest_lib_export.so libtest_lib_export.dylib
          rm -f test_c_host test_c_host.exe test_wl_host test_wl_host.exe
          echo "All FFI tests passed."

      - name: "[Windows] Compile InnoSetup Installer"
        if: startsWith(matrix.os_name, 'windows')
        shell: powershell
        run: |
          mkdir -Force Output
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $outName = "WhiteLanguage-Windows-x64-Setup-$tagVersion"
          iscc /dAppVersion="$tagVersion" /dAppArch="x64" /O"Output" /F"$outName" whitelang.iss

      - name: "[Unix] Compress Tarball"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        run: |
          cd release_pkg
          tar -czf ../Output/${{ matrix.artifact }} .

      - name: "[Windows] Create Portable Zip"
        if: startsWith(matrix.os_name, 'windows')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $zipName = "WhiteLanguage-Windows-x64-Portable-$tagVersion.zip"
          Compress-Archive -Path "release_pkg\*" -DestinationPath "Output\$zipName" -Force

      - name: Prepare Final Versioned Names
        id: prep_name
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd Output
          if [ -f "whitelang-${{ matrix.os_name }}.tar.gz" ]; then
            mv "whitelang-${{ matrix.os_name }}.tar.gz" "whitelang-${{ matrix.os_name }}-${VERSION}.tar.gz"
          fi

      - name: Upload Final Artifacts to Main Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Output/*

      - name: Upload Snapshots to Separate Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}-snapshots
          name: snapshots-${{ github.ref_name }}
          prerelease: true
          files: Output_Snapshots/*

      - name: Stash for latest promotion
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}
          path: Output/
          retention-days: 1

      - name: Cleanup Tag on Failure
        if: failure() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Workflow failed! Deleting tag ${{ github.ref_name }} from remote..."
          git push --delete origin ${{ github.ref_name }} || true

  promote-to-r2:
    name: Sync Assets to Cloudflare R2
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platforms assets
        uses: actions/download-artifact@v4
        with:
          path: all_assets
          pattern: assets-*
          merge-multiple: true

      - name: Sync to R2 Selective (Dots Logic)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          TAG="${{ github.ref_name }}"
          DOT_COUNT=$(echo $TAG | tr -cd '.' | wc -c)

          if [ "$DOT_COUNT" -eq 1 ]; then
            aws s3 sync all_assets/ s3://${{ secrets.R2_BUCKET_NAME }}/${TAG}/ \
              --exclude "*Portable*" \
              --delete \
              --endpoint-url ${{ secrets.R2_ENDPOINT }}

            aws s3 sync all_assets/ s3://${{ secrets.R2_BUCKET_NAME }}/latest/ \
              --exclude "*Portable*" \
              --delete \
              --endpoint-url ${{ secrets.R2_ENDPOINT }}
          fi

name: White Language Global Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: Action to perform
        type: choice
        options:
          - repair
          - sync-r2
        default: repair
      release_tag:
        description: Release tag to repair (v0.X.X)
        type: string
        required: false
      source_run_id:
        description: Failed release run ID to recover artifacts from (optional)
        type: string
        required: false
      platform:
        description: Platform to rebuild
        type: choice
        options:
          - macos-x64
          - macos-arm64
          - windows-x64
          - windows-x32
          - linux-x64
          - linux-x86
          - linux-arm64
          - linux-armv7
        default: macos-x64

permissions:
  actions: read
  contents: write

jobs:
  prepare-release:
    name: Prepare release build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      version: ${{ steps.config.outputs.version }}
      platform: ${{ steps.config.outputs.platform }}
      build_armv7: ${{ steps.config.outputs.build_armv7 }}
      publish: ${{ steps.config.outputs.publish }}
      full_release: ${{ steps.config.outputs.full_release }}
    steps:
      - name: Select build targets
        id: config
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          all_targets='[{"os_name":"windows-x64","runner":"windows-latest","artifact":"WhiteLanguage-Windows-x64-Setup.exe","llvm_repo":"mstorsjo/llvm-mingw","asset_keyword":"ucrt-x86_64.zip","archive_name":"llvm.zip","target_arch":"x86_64","package_arch":"x64","windows_target_dir":"x86_64-w64-mingw32"},{"os_name":"windows-x32","runner":"windows-latest","artifact":"WhiteLanguage-Windows-x32-Setup.exe","llvm_repo":"mstorsjo/llvm-mingw","asset_keyword":"ucrt-i686.zip","archive_name":"llvm.zip","target_arch":"i686","package_arch":"x32","windows_target_dir":"i686-w64-mingw32"},{"os_name":"macos-arm64","runner":"macos-14","artifact":"whitelang-macos-arm64.tar.gz","llvm_repo":"llvm/llvm-project","asset_keyword":"macOS-ARM64.tar.xz","archive_name":"llvm.tar.xz","target_arch":"aarch64"},{"os_name":"macos-x64","runner":"macos-15-intel","artifact":"whitelang-macos-x64.tar.gz","archive_name":"llvm.tar.xz","target_arch":"x86_64","reuse_toolchain":true},{"os_name":"linux-x64","runner":"ubuntu-latest","artifact":"whitelang-linux-x64.tar.gz","llvm_repo":"llvm/llvm-project","asset_keyword":"Linux-X64.tar.xz","archive_name":"llvm.tar.xz","target_arch":"x86_64"},{"os_name":"linux-x86","runner":"ubuntu-latest","artifact":"whitelang-linux-x86.tar.gz","archive_name":"llvm.tar.xz","target_arch":"i686","reuse_toolchain":true},{"os_name":"linux-arm64","runner":"ubuntu-24.04-arm","artifact":"whitelang-linux-arm64.tar.gz","llvm_repo":"llvm/llvm-project","asset_keyword":"Linux-ARM64.tar.xz","archive_name":"llvm.tar.xz","target_arch":"aarch64"}]'

          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
            platform=all
            matrix="$all_targets"
            build_armv7=true
            publish=true
            full_release=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_OPERATION" = repair ]; then
            release_tag="$REQUESTED_TAG"
            platform="$REQUESTED_PLATFORM"
            if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::A valid release_tag is required for a repair build."
              exit 1
            fi
            if [ "$platform" = linux-armv7 ]; then
              matrix=$(printf '%s' "$all_targets" | jq -c '[.[] | select(.os_name == "linux-x64")]')
              build_armv7=true
            else
              matrix=$(printf '%s' "$all_targets" | jq -c --arg platform "$platform" '[.[] | select(.os_name == $platform)]')
              if [ "$matrix" = '[]' ]; then
                echo "::error::Unsupported repair platform '$platform'."
                exit 1
              fi
              build_armv7=false
            fi
            publish=true
            full_release=false
          else
            release_tag=""
            platform=none
            matrix='[]'
            build_armv7=false
            publish=false
            full_release=false
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "build_armv7=$build_armv7" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "full_release=$full_release" >> "$GITHUB_OUTPUT"

  warm-llvm-cache:
    name: Cache LLVM for ${{ matrix.os_name }}
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            llvm_repo: mstorsjo/llvm-mingw
            asset_keyword: ucrt-x86_64.zip
            archive_name: llvm.zip

          - os_name: windows-x32
            runner: windows-latest
            llvm_repo: mstorsjo/llvm-mingw
            asset_keyword: ucrt-i686.zip
            archive_name: llvm.zip

          - os_name: macos-arm64
            runner: macos-14
            llvm_repo: llvm/llvm-project
            asset_keyword: macOS-ARM64.tar.xz
            archive_name: llvm.tar.xz

          - os_name: linux-x64
            runner: ubuntu-latest
            llvm_repo: llvm/llvm-project
            asset_keyword: Linux-X64.tar.xz
            archive_name: llvm.tar.xz

          - os_name: linux-arm64
            runner: ubuntu-24.04-arm
            llvm_repo: llvm/llvm-project
            asset_keyword: Linux-ARM64.tar.xz
            archive_name: llvm.tar.xz

    steps:
      - name: Find LLVM release asset
        id: get_llvm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo ${{ matrix.llvm_repo }} --json assets -q '[.assets[] | select(.name | contains("${{ matrix.asset_keyword }}")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No LLVM asset matched '${{ matrix.asset_keyword }}'."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Cache complete LLVM archive
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: .llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}
          key: llvm-archive-v1-${{ matrix.os_name }}-${{ steps.get_llvm.outputs.url }}

      - name: Download complete LLVM archive
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ".llvm-cache/${{ matrix.os_name }}"
          curl --fail --location --retry 3 --output ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" "${{ steps.get_llvm.outputs.url }}"
          test -s ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}"

  build-and-package:
    name: Build for ${{ matrix.os_name }}
    needs: prepare-release
    if: needs.prepare-release.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
      VERSION_NO_V: ${{ needs.prepare-release.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Checkout White Language Source
        uses: actions/checkout@v4
        with:
          repository: 'whitelanguage/white'
          path: 'source_repo'
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Remove Blacklisted Folders
        shell: bash
        run: |
          BLACKLIST_DIRS="docs tools"

          echo "Applying blacklist deletions in source_repo..."
          cd source_repo
          for dir in $BLACKLIST_DIRS; do
            if [ -e "$dir" ]; then
              echo "Removing blacklisted item: $dir"
              rm -rf "$dir"
            fi
          done

      - name: Create Package Layout
        shell: bash
        run: |
          mkdir -p release_pkg/bin
          mkdir -p release_pkg/runtime
          mkdir -p release_pkg/tools/llvm/bin
          mkdir -p Output Output_Snapshots
          mkdir -p release_pkg/std

      - name: Restore previous target toolchain
        if: matrix.reuse_toolchain == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p boot_env boot_dl
          RELEASE_TAGS=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName')
          PREV_TAG=$(printf '%s\n' "$RELEASE_TAGS" | grep -v "^${TARGET_REF}$" | grep -v '^temp$' | grep -v "snapshot" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a previous release for ${{ matrix.os_name }}."
            exit 1
          fi
          gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "whitelang-${{ matrix.os_name }}-*.tar.gz" --dir boot_dl --clobber
          tar -xzf boot_dl/*.tar.gz -C boot_env
          rm -rf release_pkg/tools
          cp -a boot_env/tools release_pkg/tools

      - name: "[Linux x86] Install 32-bit system libraries"
        if: matrix.os_name == 'linux-x86'
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6:i386 libc6-dev:i386 libstdc++6:i386

      - name: Find LLVM release asset
        id: get_llvm
        if: matrix.reuse_toolchain != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo ${{ matrix.llvm_repo }} --json assets -q '[.assets[] | select(.name | contains("${{ matrix.asset_keyword }}")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No LLVM asset matched '${{ matrix.asset_keyword }}'."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Restore complete LLVM archive
        id: restore-llvm
        if: matrix.reuse_toolchain != true
        uses: actions/cache/restore@v4
        with:
          path: .llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}
          key: llvm-archive-v1-${{ matrix.os_name }}-${{ steps.get_llvm.outputs.url }}

      - name: Download LLVM archive on cache miss
        if: matrix.reuse_toolchain != true && steps.restore-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "LLVM was not present in the default-branch cache; downloading it for this build."
          mkdir -p ".llvm-cache/${{ matrix.os_name }}"
          curl --fail --location --retry 3 --output ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" "${{ steps.get_llvm.outputs.url }}"
          test -s ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}"

      - name: "[Windows] Stage LLVM toolchain"
        if: startsWith(matrix.os_name, 'windows') && matrix.reuse_toolchain != true
        shell: bash
        run: |
          rm -rf llvm_full
          mkdir -p llvm_full
          unzip -q ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" -d llvm_full
          LLVM_ROOT=$(find llvm_full -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$LLVM_ROOT" ] || [ ! -f "$LLVM_ROOT/bin/clang.exe" ]; then
            echo "::error::The cached LLVM archive does not contain a complete Windows toolchain."
            exit 1
          fi
          rm -rf release_pkg/tools/llvm
          mv "$LLVM_ROOT" release_pkg/tools/llvm
          rm -rf llvm_full

      - name: "[Unix] Stage LLVM toolchain"
        if: startsWith(matrix.os_name, 'windows') == false && matrix.reuse_toolchain != true
        shell: bash
        run: |
          rm -rf llvm_full
          mkdir -p llvm_full
          tar -xf ".llvm-cache/${{ matrix.os_name }}/${{ matrix.archive_name }}" -C llvm_full --strip-components=1
          if [ ! -f "llvm_full/bin/clang" ] || [ ! -d "llvm_full/lib/clang" ]; then
            echo "::error::The cached LLVM archive does not contain a complete Unix toolchain."
            exit 1
          fi
          mkdir -p release_pkg/tools/llvm/bin release_pkg/tools/llvm/lib
          cp -a llvm_full/bin/clang llvm_full/bin/clang-[0-9]* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/ld.lld* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/lld* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/llvm-objdump* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/lib/clang release_pkg/tools/llvm/lib/
          rm -rf llvm_full

      - name: "[Windows] Bootstrap Compiler & Build Runtime"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p boot_env boot_dl
          RELEASE_TAGS=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName')
          PREV_TAG=$(printf '%s\n' "$RELEASE_TAGS" | grep -v "^${TARGET_REF}$" | grep -v '^temp$' | grep -v "snapshot" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a valid previous release tag to bootstrap from."
            exit 1
          fi

          SOURCE_BASE_TAG="$PREV_TAG"

          echo "Bootstrapping from previous release: $PREV_TAG"
          gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "WhiteLanguage-Windows-${{ matrix.package_arch }}-Portable-*.zip" --dir boot_dl --clobber
          unzip -q boot_dl/*.zip -d boot_env

          if [ "${{ matrix.os_name }}" == "windows-x32" ]; then
            for LLVM_HOME in release_pkg/tools/llvm boot_env/tools/llvm; do
              printf '%s\n' '-fuse-ld=lld' '-L<CFGDIR>/../i686-w64-mingw32/lib' > "$LLVM_HOME/bin/i686-pc-windows-msvc.cfg"
              cp "$LLVM_HOME/bin/i686-pc-windows-msvc.cfg" "$LLVM_HOME/bin/i686-pc-windows-msvc-clang.cfg"
            done
          fi

          GLOBAL_LLVM_BIN_ROOT=$(cygpath -m "$PWD/release_pkg/tools/llvm/bin")
          rm -f wlc_icon.res
          if [ -f "wlc.rc" ]; then
            "$GLOBAL_LLVM_BIN_ROOT/windres.exe" wlc.rc -O coff -o wlc_icon.res
          fi

          ICON_PATH_ABS=""
          if [ -f "wlc_icon.res" ]; then
            ICON_PATH_ABS=$(cygpath -m "$PWD/wlc_icon.res")
          fi

          cd source_repo
          RELEASE_TAG="$TARGET_REF"
          VERSION_NO_V="${RELEASE_TAG#v}"
          COMMITS=$(git rev-list --reverse "${SOURCE_BASE_TAG}..${TARGET_REF}")
          FINAL_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          COMMIT_DATE=$(git show -s --format=%cs "$FINAL_COMMIT")

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$RELEASE_TAG' is not a valid White Language version."
            exit 1
          fi

          stamp_release_metadata() {
            awk -v version="$VERSION_NO_V" -v revision="$FINAL_COMMIT" -v commit_date="$COMMIT_DATE" '
              BEGIN { versions = 0; revisions = 0; dates = 0 }
              /^[[:space:]]*const[[:space:]]+VERSION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" version "\";"); print; versions++; next }
              /^[[:space:]]*const[[:space:]]+REVISION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" revision "\";"); print; revisions++; next }
              /^[[:space:]]*const[[:space:]]+COMMIT_DATE[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" commit_date "\";"); print; dates++; next }
              { print }
              END { if (versions != 1 || revisions != 1 || dates != 1) exit 2 }
            ' src/wlc.wl > src/wlc.wl.release || {
              rm -f src/wlc.wl.release
              echo "::error::Could not stamp release metadata in src/wlc.wl."
              exit 1
            }
            mv src/wlc.wl.release src/wlc.wl
          }

          echo "Release tag: $RELEASE_TAG"
          echo "Release commit: $FINAL_COMMIT"
          echo "Commit date: $COMMIT_DATE"

          GLOBAL_LLVM_BIN=$(cygpath -m "$PWD/../release_pkg/tools/llvm/bin")
          export PATH="$GLOBAL_LLVM_BIN:$PATH"

          ACTIVE_WLC=$(cygpath -m "$(find "$PWD/../boot_env" -name wlc.exe | head -n 1)")
          ACTIVE_ENV=$(cygpath -m "$(dirname $(dirname "$ACTIVE_WLC"))")

          run_bootstrap_attempt() {
            local timeout_seconds="${WLC_BOOTSTRAP_TIMEOUT_SECONDS:-300}"
            local marker="/tmp/wlc-bootstrap-timeout-$$-$RANDOM"
            local status=0
            rm -f "$marker"
            "$@" &
            local compiler_pid=$!
            (
              sleep "$timeout_seconds"
              if kill -0 "$compiler_pid" 2>/dev/null; then
                echo "::warning::Bootstrap compiler exceeded ${timeout_seconds}s; trying the next compatibility fallback."
                : > "$marker"
                kill "$compiler_pid" 2>/dev/null || true
                sleep 5
                kill -9 "$compiler_pid" 2>/dev/null || true
              fi
            ) &
            local watchdog_pid=$!
            wait "$compiler_pid" || status=$?
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            if [ -f "$marker" ]; then
              rm -f "$marker"
              return 124
            fi
            return "$status"
          }

          for COMMIT in $COMMITS; do
            SHORT_SHA=$(git rev-parse --short $COMMIT)
            echo "------------------------------------------------"
            echo "Bootstrapping Commit: $SHORT_SHA"
            git checkout $COMMIT
            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              stamp_release_metadata
            fi
            cp -a "$ACTIVE_ENV/std" "$ACTIVE_ENV/std_backup"
            rm -rf "$ACTIVE_ENV/runtime_backup"
            if [ -d "$ACTIVE_ENV/runtime" ]; then cp -a "$ACTIVE_ENV/runtime" "$ACTIVE_ENV/runtime_backup"; fi

            HAS_NATIVE_RT=false
            if [ -f runtime/wl_runtime.c ]; then
              HAS_NATIVE_RT=true
              mkdir -p "$ACTIVE_ENV/runtime"
              "$GLOBAL_LLVM_BIN/clang.exe" -c runtime/wl_runtime.c -o "$ACTIVE_ENV/runtime/wl_runtime_new.obj" -O2
            fi
            NEW_RT_LABEL="New RT"
            if [ "$HAS_NATIVE_RT" = false ]; then NEW_RT_LABEL="No RT"; fi

            export WL_PATH="$ACTIVE_ENV"
            mkdir -p ../build_${SHORT_SHA}/bin ../build_${SHORT_SHA}/std
            cp -r ../release_pkg/tools ../build_${SHORT_SHA}/

            ICON_ARG=""
            if [ -n "$ICON_PATH_ABS" ]; then
              ICON_ARG="$ICON_PATH_ABS"
            fi

            apply_env() {
              rm -rf "$ACTIVE_ENV/std" "$ACTIVE_ENV/runtime/wl_runtime.obj"
              mkdir -p "$ACTIVE_ENV/std"
              if [ "$1" == "new_std" ]; then cp -rf std/* "$ACTIVE_ENV/std/" 2>/dev/null || true; else cp -a "$ACTIVE_ENV/std_backup/." "$ACTIVE_ENV/std/"; fi
              if [ "$2" == "new_rt" ]; then
                if [ "$HAS_NATIVE_RT" = true ]; then
                  mkdir -p "$ACTIVE_ENV/runtime"
                  cp "$ACTIVE_ENV/runtime/wl_runtime_new.obj" "$ACTIVE_ENV/runtime/wl_runtime.obj"
                else
                  rm -rf "$ACTIVE_ENV/runtime"
                fi
              elif [ -f "$ACTIVE_ENV/runtime_backup/wl_runtime.obj" ]; then
                mkdir -p "$ACTIVE_ENV/runtime"
                cp "$ACTIVE_ENV/runtime_backup/wl_runtime.obj" "$ACTIVE_ENV/runtime/wl_runtime.obj"
              else
                rm -rf "$ACTIVE_ENV/runtime"
              fi
            }

            echo "Stage 1: Trying [New STD + $NEW_RT_LABEL]..."
            apply_env new_std new_rt
            if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
              echo "[New STD + $NEW_RT_LABEL] succeeded."
            elif [ "$HAS_NATIVE_RT" = false ]; then
              echo "Failed. Trying [Old STD + No RT]..."
              apply_env old_std new_rt
              if ! run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                echo "All fallback combinations failed!"
                exit 1
              fi
              echo "[Old STD + No RT] succeeded."
            else
              echo "Failed. Trying [New STD + Old RT]..."
              apply_env new_std old_rt
              if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                echo "[New STD + Old RT] succeeded."
              else
                echo "Failed. Trying [Old STD + $NEW_RT_LABEL]..."
                apply_env old_std new_rt
                if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                  echo "[Old STD + $NEW_RT_LABEL] succeeded."
                else
                  echo "Failed. Trying [Old STD + Old RT]..."
                  apply_env old_std old_rt
                  if ! run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc_temp.exe -Oz; then
                    echo "All fallback combinations failed!"
                    exit 1
                  fi
                  echo "[Old STD + Old RT] succeeded."
                fi
              fi
            fi

            echo "Stage 2: Finalizing with latest STD and runtime state..."
            apply_env new_std new_rt
            if ! run_bootstrap_attempt "../build_${SHORT_SHA}/bin/wlc_temp.exe" src/wlc.wl $ICON_ARG -o ../build_${SHORT_SHA}/bin/wlc.exe -Oz; then
              echo "::error::Stage 2 failed or exceeded the bootstrap timeout."
              exit 1
            fi
            rm -f ../build_${SHORT_SHA}/bin/wlc_temp.exe "$ACTIVE_ENV/runtime/wl_runtime_new.obj"
            rm -rf "$ACTIVE_ENV/std_backup" "$ACTIVE_ENV/runtime_backup"

            if [ "$HAS_NATIVE_RT" = true ]; then
              mkdir -p ../build_${SHORT_SHA}/runtime
              cp "$ACTIVE_ENV/runtime/wl_runtime.obj" ../build_${SHORT_SHA}/runtime/wl_runtime.obj
            else
              rm -rf ../build_${SHORT_SHA}/runtime
            fi
            cp -r std/* ../build_${SHORT_SHA}/std/

            ACTIVE_WLC=$(cygpath -m "$PWD/../build_${SHORT_SHA}/bin/wlc.exe")
            ACTIVE_ENV=$(cygpath -m "$PWD/../build_${SHORT_SHA}")

            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              cp "$ACTIVE_WLC" ../release_pkg/bin/
              if [ "$HAS_NATIVE_RT" = true ]; then
                mkdir -p ../release_pkg/runtime
                cp ../build_${SHORT_SHA}/runtime/wl_runtime.obj ../release_pkg/runtime/
              else
                rm -rf ../release_pkg/runtime
              fi
              cp -r std/* ../release_pkg/std/
            else
              SNAP_NAME="${{ matrix.os_name }}-${VERSION_NO_V}-snapshot-${SHORT_SHA}"
              cd ../build_${SHORT_SHA}
              if [ -d runtime ]; then
                7z a -tzip ../Output_Snapshots/${SNAP_NAME}.zip bin std runtime > /dev/null
              else
                7z a -tzip ../Output_Snapshots/${SNAP_NAME}.zip bin std > /dev/null
              fi
              cd ../source_repo
            fi
          done
          git checkout ${{ env.TARGET_REF }}
          stamp_release_metadata

          echo "================================================"
          echo " Starting Compiler Idempotency Check (LLVM IR)"
          echo "================================================"
          export WL_PATH=$(cygpath -m "$PWD/../release_pkg")
          WLC_CURRENT=$(cygpath -m "$PWD/../release_pkg/bin/wlc.exe")
          WLC_NEXT=$(cygpath -m "$PWD/../release_pkg/bin/wlc_next.exe")
          emit_compiler_ir() {
            rm -f src/wlc.ll
            run_bootstrap_attempt "$1" src/wlc.wl -S --emit-llvm -Oz || return $?
            if [ ! -s src/wlc.ll ]; then
              echo "::error::Compiler did not emit src/wlc.ll."
              return 1
            fi
            mv -f src/wlc.ll "$2"
          }

          emit_compiler_ir "$WLC_CURRENT" "../wlc_current.ll"

          MATCH=false
          for TRY in 1 2 3; do
            echo "Fixpoint Try #$TRY..."
            run_bootstrap_attempt "$WLC_CURRENT" src/wlc.wl $ICON_ARG -o "$WLC_NEXT" -Oz
            emit_compiler_ir "$WLC_NEXT" "../wlc_next.ll"

            if diff -u "../wlc_current.ll" "../wlc_next.ll" > ../diff.log; then
              echo "LLVM IR strictly matches! Fixpoint reached at try #$TRY."
              MATCH=true
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              break
            else
              echo "LLVM IR mismatch on try #$TRY. Diff preview (first 20 lines):"
              head -n 20 ../diff.log
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              mv -f "../wlc_next.ll" "../wlc_current.ll"
            fi
          done

          rm -f ../wlc_current.ll ../wlc_next.ll ../diff.log src/wlc.ll
          if [ "$MATCH" = false ]; then
            echo "::error::Compiler failed to reach fixpoint after 3 tries. LLVM IR still diverges!"
            exit 1
          fi

          echo ""
          echo "================================================"
          echo " Starting C Runtime Determinism Check (Assembly)"
          echo "================================================"
          if [ -f runtime/wl_runtime.c ] && [ -f ../release_pkg/runtime/wl_runtime.obj ]; then
            OBJDUMP_CMD="$GLOBAL_LLVM_BIN/llvm-objdump.exe"
            RT_CURRENT=$(cygpath -m "$PWD/../release_pkg/runtime/wl_runtime.obj")
            RT_NEXT=$(cygpath -m "$PWD/../release_pkg/runtime/wl_runtime_next.obj")

            "$OBJDUMP_CMD" -d "$RT_CURRENT" | awk '!/file format/ && NF' > "../rt_current.asm"
            "$GLOBAL_LLVM_BIN/clang.exe" -c runtime/wl_runtime.c -o "$RT_NEXT" -O2
            "$OBJDUMP_CMD" -d "$RT_NEXT" | awk '!/file format/ && NF' > "../rt_next.asm"

            if diff -u "../rt_current.asm" "../rt_next.asm" > ../diff_rt.log; then
              echo "C Runtime assembly strictly matches! Deterministic build confirmed."
            else
              echo "::error::C Runtime assembly mismatch! Compilation is non-deterministic."
              head -n 20 ../diff_rt.log
              exit 1
            fi
            rm -f ../rt_current.asm ../rt_next.asm ../diff_rt.log "$RT_NEXT"
          else
            echo "No native C runtime in this release; determinism check skipped."
            rm -rf ../release_pkg/runtime
          fi

      - name: "[Unix] Bootstrap Compiler & Build Runtime"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p boot_env boot_dl
          RELEASE_TAGS=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName')
          PREV_TAG=$(printf '%s\n' "$RELEASE_TAGS" | grep -v "^${TARGET_REF}$" | grep -v '^temp$' | grep -v "snapshot" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a valid previous release tag to bootstrap from."
            exit 1
          fi

          SOURCE_BASE_TAG="$PREV_TAG"

          echo "Bootstrapping from previous release: $PREV_TAG"
          if [ ! -f boot_env/bin/wlc ]; then
            gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "whitelang-${{ matrix.os_name }}-*.tar.gz" --dir boot_dl --clobber
            tar -xzf boot_dl/*.tar.gz -C boot_env
          fi

          cd source_repo
          RELEASE_TAG="$TARGET_REF"
          VERSION_NO_V="${RELEASE_TAG#v}"
          COMMITS=$(git rev-list --reverse "${SOURCE_BASE_TAG}..${TARGET_REF}")
          FINAL_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          COMMIT_DATE=$(git show -s --format=%cs "$FINAL_COMMIT")

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$RELEASE_TAG' is not a valid White Language version."
            exit 1
          fi

          stamp_release_metadata() {
            awk -v version="$VERSION_NO_V" -v revision="$FINAL_COMMIT" -v commit_date="$COMMIT_DATE" '
              BEGIN { versions = 0; revisions = 0; dates = 0 }
              /^[[:space:]]*const[[:space:]]+VERSION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" version "\";"); print; versions++; next }
              /^[[:space:]]*const[[:space:]]+REVISION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" revision "\";"); print; revisions++; next }
              /^[[:space:]]*const[[:space:]]+COMMIT_DATE[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" commit_date "\";"); print; dates++; next }
              { print }
              END { if (versions != 1 || revisions != 1 || dates != 1) exit 2 }
            ' src/wlc.wl > src/wlc.wl.release || {
              rm -f src/wlc.wl.release
              echo "::error::Could not stamp release metadata in src/wlc.wl."
              exit 1
            }
            mv src/wlc.wl.release src/wlc.wl
          }

          echo "Release tag: $RELEASE_TAG"
          echo "Release commit: $FINAL_COMMIT"
          echo "Commit date: $COMMIT_DATE"

          GLOBAL_LLVM_BIN="$PWD/../release_pkg/tools/llvm/bin"
          export PATH="$GLOBAL_LLVM_BIN:$PATH"

          ACTIVE_WLC="$PWD/../boot_env/bin/wlc"
          ACTIVE_ENV="$PWD/../boot_env"
          chmod +x "$ACTIVE_WLC"

          run_bootstrap_attempt() {
            local timeout_seconds="${WLC_BOOTSTRAP_TIMEOUT_SECONDS:-300}"
            local marker="/tmp/wlc-bootstrap-timeout-$$-$RANDOM"
            local status=0
            rm -f "$marker"
            "$@" &
            local compiler_pid=$!
            (
              sleep "$timeout_seconds"
              if kill -0 "$compiler_pid" 2>/dev/null; then
                echo "::warning::Bootstrap compiler exceeded ${timeout_seconds}s; trying the next compatibility fallback."
                : > "$marker"
                kill "$compiler_pid" 2>/dev/null || true
                sleep 5
                kill -9 "$compiler_pid" 2>/dev/null || true
              fi
            ) &
            local watchdog_pid=$!
            wait "$compiler_pid" || status=$?
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            if [ -f "$marker" ]; then
              rm -f "$marker"
              return 124
            fi
            return "$status"
          }

          if [[ "${{ matrix.os_name }}" == macos-* ]]; then
            export SDKROOT=$(xcrun --show-sdk-path)
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          for COMMIT in $COMMITS; do
            SHORT_SHA=$(git rev-parse --short $COMMIT)
            echo "------------------------------------------------"
            echo "Bootstrapping Commit: $SHORT_SHA"
            git checkout $COMMIT
            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              stamp_release_metadata
            fi

            cp -a "$ACTIVE_ENV/std" "$ACTIVE_ENV/std_backup"
            rm -rf "$ACTIVE_ENV/runtime_backup"
            if [ -d "$ACTIVE_ENV/runtime" ]; then cp -a "$ACTIVE_ENV/runtime" "$ACTIVE_ENV/runtime_backup"; fi

            HAS_NATIVE_RT=false
            if [ -f runtime/wl_runtime.c ]; then
              HAS_NATIVE_RT=true
              mkdir -p "$ACTIVE_ENV/runtime"
              "$GLOBAL_LLVM_BIN/clang" -c runtime/wl_runtime.c -o "$ACTIVE_ENV/runtime/wl_runtime_new.o" -O2
            fi
            NEW_RT_LABEL="New RT"
            if [ "$HAS_NATIVE_RT" = false ]; then NEW_RT_LABEL="No RT"; fi

            export WL_PATH="$ACTIVE_ENV"
            mkdir -p ../build_${SHORT_SHA}/bin ../build_${SHORT_SHA}/std
            cp -r ../release_pkg/tools ../build_${SHORT_SHA}/

            apply_env() {
              rm -rf "$ACTIVE_ENV/std" "$ACTIVE_ENV/runtime/wl_runtime.o"
              mkdir -p "$ACTIVE_ENV/std"
              if [ "$1" == "new_std" ]; then cp -rf std/* "$ACTIVE_ENV/std/" 2>/dev/null || true; else cp -a "$ACTIVE_ENV/std_backup/." "$ACTIVE_ENV/std/"; fi
              if [ "$2" == "new_rt" ]; then
                if [ "$HAS_NATIVE_RT" = true ]; then
                  mkdir -p "$ACTIVE_ENV/runtime"
                  cp "$ACTIVE_ENV/runtime/wl_runtime_new.o" "$ACTIVE_ENV/runtime/wl_runtime.o"
                else
                  rm -rf "$ACTIVE_ENV/runtime"
                fi
              elif [ -f "$ACTIVE_ENV/runtime_backup/wl_runtime.o" ]; then
                mkdir -p "$ACTIVE_ENV/runtime"
                cp "$ACTIVE_ENV/runtime_backup/wl_runtime.o" "$ACTIVE_ENV/runtime/wl_runtime.o"
              else
                rm -rf "$ACTIVE_ENV/runtime"
              fi
            }

            echo "Stage 1: Trying [New STD + $NEW_RT_LABEL]..."
            apply_env new_std new_rt
            if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
              echo "[New STD + $NEW_RT_LABEL] succeeded."
            elif [ "$HAS_NATIVE_RT" = false ]; then
              echo "Failed. Trying [Old STD + No RT]..."
              apply_env old_std new_rt
              if ! run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                echo "All fallback combinations failed!"
                exit 1
              fi
              echo "[Old STD + No RT] succeeded."
            else
              echo "Failed. Trying [New STD + Old RT]..."
              apply_env new_std old_rt
              if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                echo "[New STD + Old RT] succeeded."
              else
                echo "Failed. Trying [Old STD + $NEW_RT_LABEL]..."
                apply_env old_std new_rt
                if run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                  echo "[Old STD + $NEW_RT_LABEL] succeeded."
                else
                  echo "Failed. Trying [Old STD + Old RT]..."
                  apply_env old_std old_rt
                  if ! run_bootstrap_attempt "$ACTIVE_WLC" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc_temp -Oz; then
                    echo "All fallback combinations failed!"
                    exit 1
                  fi
                  echo "[Old STD + Old RT] succeeded."
                fi
              fi
            fi

            echo "Stage 2: Finalizing with latest STD and runtime state..."
            apply_env new_std new_rt
            if ! run_bootstrap_attempt "../build_${SHORT_SHA}/bin/wlc_temp" src/wlc.wl -o ../build_${SHORT_SHA}/bin/wlc -Oz; then
              echo "::error::Stage 2 failed or exceeded the bootstrap timeout."
              exit 1
            fi
            rm -f ../build_${SHORT_SHA}/bin/wlc_temp "$ACTIVE_ENV/runtime/wl_runtime_new.o"
            rm -rf "$ACTIVE_ENV/std_backup" "$ACTIVE_ENV/runtime_backup"

            if [ "$HAS_NATIVE_RT" = true ]; then
              mkdir -p ../build_${SHORT_SHA}/runtime
              cp "$ACTIVE_ENV/runtime/wl_runtime.o" ../build_${SHORT_SHA}/runtime/wl_runtime.o
            else
              rm -rf ../build_${SHORT_SHA}/runtime
            fi
            cp -r std/* ../build_${SHORT_SHA}/std/

            ACTIVE_WLC="$PWD/../build_${SHORT_SHA}/bin/wlc"
            ACTIVE_ENV="$PWD/../build_${SHORT_SHA}"

            if [ "$COMMIT" == "$FINAL_COMMIT" ]; then
              cp "$ACTIVE_WLC" ../release_pkg/bin/
              if [ "$HAS_NATIVE_RT" = true ]; then
                mkdir -p ../release_pkg/runtime
                cp ../build_${SHORT_SHA}/runtime/wl_runtime.o ../release_pkg/runtime/
              else
                rm -rf ../release_pkg/runtime
              fi
              cp -r std/* ../release_pkg/std/
            else
              SNAP_NAME="${{ matrix.os_name }}-${VERSION_NO_V}-snapshot-${SHORT_SHA}"
              cd ../build_${SHORT_SHA}
              if [ -d runtime ]; then
                tar -czf ../Output_Snapshots/${SNAP_NAME}.tar.gz bin std runtime
              else
                tar -czf ../Output_Snapshots/${SNAP_NAME}.tar.gz bin std
              fi
              cd ../source_repo
            fi
          done
          git checkout ${{ env.TARGET_REF }}
          stamp_release_metadata

          echo "================================================"
          echo " Starting Compiler Idempotency Check (LLVM IR)"
          echo "================================================"
          export WL_PATH="$PWD/../release_pkg"
          WLC_CURRENT="$PWD/../release_pkg/bin/wlc"
          WLC_NEXT="$PWD/../release_pkg/bin/wlc_next"

          emit_compiler_ir() {
            rm -f src/wlc.ll
            run_bootstrap_attempt "$1" src/wlc.wl -S --emit-llvm -Oz || return $?
            if [ ! -s src/wlc.ll ]; then
              echo "::error::Compiler did not emit src/wlc.ll."
              return 1
            fi
            mv -f src/wlc.ll "$2"
          }

          emit_compiler_ir "$WLC_CURRENT" "../wlc_current.ll"

          MATCH=false
          for TRY in 1 2 3; do
            echo "Fixpoint Try #$TRY..."
            run_bootstrap_attempt "$WLC_CURRENT" src/wlc.wl -o "$WLC_NEXT" -Oz
            emit_compiler_ir "$WLC_NEXT" "../wlc_next.ll"

            if diff -u "../wlc_current.ll" "../wlc_next.ll" > ../diff.log; then
              echo "LLVM IR strictly matches! Fixpoint reached at try #$TRY."
              MATCH=true
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              break
            else
              echo "LLVM IR mismatch on try #$TRY. Diff preview (first 20 lines):"
              head -n 20 ../diff.log
              mv -f "$WLC_NEXT" "$WLC_CURRENT"
              mv -f "../wlc_next.ll" "../wlc_current.ll"
            fi
          done

          rm -f ../wlc_current.ll ../wlc_next.ll ../diff.log src/wlc.ll
          if [ "$MATCH" = false ]; then
            echo "::error::Compiler failed to reach fixpoint after 3 tries. LLVM IR still diverges!"
            exit 1
          fi

          echo ""
          echo "================================================"
          echo " Starting C Runtime Determinism Check (Assembly)"
          echo "================================================"
          if [ -f runtime/wl_runtime.c ] && [ -f ../release_pkg/runtime/wl_runtime.o ]; then
            OBJDUMP_CMD="$GLOBAL_LLVM_BIN/llvm-objdump"
            if [ "${{ matrix.os_name }}" == "linux-x86" ]; then OBJDUMP_CMD="objdump"; fi
            RT_CURRENT="$PWD/../release_pkg/runtime/wl_runtime.o"
            RT_NEXT="$PWD/../release_pkg/runtime/wl_runtime_next.o"

            "$OBJDUMP_CMD" -d "$RT_CURRENT" | awk '!/file format/ && NF' > "../rt_current.asm"
            "$GLOBAL_LLVM_BIN/clang" -c runtime/wl_runtime.c -o "$RT_NEXT" -O2
            "$OBJDUMP_CMD" -d "$RT_NEXT" | awk '!/file format/ && NF' > "../rt_next.asm"

            if diff -u "../rt_current.asm" "../rt_next.asm" > ../diff_rt.log; then
              echo "C Runtime assembly strictly matches! Deterministic build confirmed."
            else
              echo "::error::C Runtime assembly mismatch! Compilation is non-deterministic."
              head -n 20 ../diff_rt.log
              exit 1
            fi
            rm -f ../rt_current.asm ../rt_next.asm ../diff_rt.log "$RT_NEXT"
          else
            echo "No native C runtime in this release; determinism check skipped."
            rm -rf ../release_pkg/runtime
          fi

      - name: "[Windows] Prepare C FFI host"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          WLC="$PWD/release_pkg/bin/wlc.exe"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang.exe"
          FFI_DIR="$PWD/source_repo/tests/integration/ffi"

          cd "$FFI_DIR"
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_c_host.exe
          "$WLC" test_lib_export.wl --shared
          "$CLANG" test_dll_host.c test_lib_export.lib -o test_c_host.exe
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp

      - name: "[Windows x32] Install matching Python"
        if: matrix.os_name == 'windows-x32'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86

      - name: "[Windows] Trim LLVM for release"
        if: startsWith(matrix.os_name, 'windows')
        shell: bash
        run: |
          LLVM_DIR="release_pkg/tools/llvm"
          TARGET_DIR="${{ matrix.windows_target_dir }}"

          rm -rf $LLVM_DIR/python $LLVM_DIR/busybox $LLVM_DIR/share $LLVM_DIR/include $LLVM_DIR/LICENSE.TXT
          for TARGET_PATH in $LLVM_DIR/aarch64-w64-mingw32 $LLVM_DIR/arm64ec-w64-mingw32 $LLVM_DIR/armv7-w64-mingw32 $LLVM_DIR/i686-w64-mingw32 $LLVM_DIR/x86_64-w64-mingw32; do
            if [ "$(basename "$TARGET_PATH")" != "$TARGET_DIR" ]; then rm -rf "$TARGET_PATH"; fi
          done
          rm -rf "$LLVM_DIR/$TARGET_DIR/share" "$LLVM_DIR/$TARGET_DIR/bin"
          rm -rf $LLVM_DIR/lib/libear $LLVM_DIR/lib/libscanbuild

          CLANG_VER_DIR=$(ls -d $LLVM_DIR/lib/clang/* | head -n 1)
          rm -rf $CLANG_VER_DIR/lib/linux $CLANG_VER_DIR/include/*_wrappers $CLANG_VER_DIR/bin $CLANG_VER_DIR/share

          rm -f $LLVM_DIR/bin/libpython*.dll $LLVM_DIR/bin/aarch64-* $LLVM_DIR/bin/armv7-* $LLVM_DIR/bin/arm64ec-* $LLVM_DIR/bin/*mingw32uwp*
          if [ "${{ matrix.os_name }}" == "windows-x64" ]; then rm -f $LLVM_DIR/bin/i686-*; else rm -f $LLVM_DIR/bin/x86_64-*; fi
          rm -f $LLVM_DIR/bin/lldb* $LLVM_DIR/bin/liblldb* $LLVM_DIR/bin/clang-format* $LLVM_DIR/bin/clang-tidy*
          rm -f $LLVM_DIR/bin/llvm-objdump* $LLVM_DIR/bin/llvm-pdbutil* $LLVM_DIR/bin/clangd* $LLVM_DIR/bin/clang-scan-deps*
          rm -f $LLVM_DIR/bin/clang-target-wrapper.exe $LLVM_DIR/bin/git-clang-format* $LLVM_DIR/bin/run-clang-tidy*
          rm -f $LLVM_DIR/bin/scan-build* $LLVM_DIR/bin/analyze-build* $LLVM_DIR/bin/intercept-build*
          rm -f $LLVM_DIR/bin/llvm-cov* $LLVM_DIR/bin/llvm-profdata* $LLVM_DIR/bin/llvm-ml* $LLVM_DIR/bin/llvm-symbolizer.exe $LLVM_DIR/bin/llvm-wrapper.exe

          rm -f $LLVM_DIR/bin/llvm-cxxfilt.exe $LLVM_DIR/bin/llvm-lib.exe $LLVM_DIR/bin/llvm-ranlib.exe $LLVM_DIR/bin/llvm-readelf.exe
          rm -f $LLVM_DIR/bin/llvm-rc.exe $LLVM_DIR/bin/llvm-cvtres.exe $LLVM_DIR/bin/llvm-dlltool.exe $LLVM_DIR/bin/llvm-readobj.exe
          rm -f $LLVM_DIR/bin/dlltool.exe $LLVM_DIR/bin/*-ar.exe $LLVM_DIR/bin/ar.exe $LLVM_DIR/bin/*-nm.exe $LLVM_DIR/bin/nm.exe
          rm -f $LLVM_DIR/bin/*-objcopy.exe $LLVM_DIR/bin/objcopy.exe $LLVM_DIR/bin/*-size.exe $LLVM_DIR/bin/size.exe
          rm -f $LLVM_DIR/bin/*-strings.exe $LLVM_DIR/bin/strings.exe $LLVM_DIR/bin/*-strip.exe $LLVM_DIR/bin/strip.exe
          rm -f $LLVM_DIR/bin/*addr2line.exe $LLVM_DIR/bin/objdump* $LLVM_DIR/bin/ranlib.exe $LLVM_DIR/bin/readelf.exe

          rm -f $LLVM_DIR/bin/{c11,c99,cc,gcc,c++,clang++,g++}.exe $LLVM_DIR/bin/*-c++.exe $LLVM_DIR/bin/*-clang++.exe $LLVM_DIR/bin/*-g++.exe
          rm -f $LLVM_DIR/bin/*.sh $LLVM_DIR/bin/*-w64-mingw32-gcc.exe $LLVM_DIR/bin/gendef.exe $LLVM_DIR/bin/mingw32-make.exe $LLVM_DIR/bin/widl.exe $LLVM_DIR/bin/ld

          rm -f $LLVM_DIR/bin/libclang_rt.asan_dynamic-*.dll $LLVM_DIR/bin/{libffi-8.dll,libomp.dll}

          rm -f $LLVM_DIR/$TARGET_DIR/lib/libd3d*.a $LLVM_DIR/$TARGET_DIR/lib/libd2d*.a $LLVM_DIR/$TARGET_DIR/lib/libx3d*.a
          rm -f $LLVM_DIR/$TARGET_DIR/lib/libxaudio*.a $LLVM_DIR/$TARGET_DIR/lib/libxinput*.a $LLVM_DIR/$TARGET_DIR/lib/libmf*.a
          rm -f $LLVM_DIR/$TARGET_DIR/lib/libwindows.*.a $LLVM_DIR/$TARGET_DIR/lib/libc++*.a

          rm -f $LLVM_DIR/$TARGET_DIR/lib/libntvdm*.a $LLVM_DIR/$TARGET_DIR/lib/*fax*.a $LLVM_DIR/$TARGET_DIR/lib/libie*.a
          rm -f $LLVM_DIR/$TARGET_DIR/lib/libvss*.a $LLVM_DIR/$TARGET_DIR/lib/libbth*.a $LLVM_DIR/$TARGET_DIR/lib/libbluetooth*.a $LLVM_DIR/$TARGET_DIR/lib/libwlan*.a
          rm -f $LLVM_DIR/$TARGET_DIR/lib/libiis*.a $LLVM_DIR/$TARGET_DIR/lib/libcryptui*.a $LLVM_DIR/$TARGET_DIR/lib/libcryptxml*.a

      - name: "[Unix] Trim LLVM for release"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        run: |
          LLVM_BIN="release_pkg/tools/llvm/bin"
          if [ -d "$LLVM_BIN" ]; then
            rm -f $LLVM_BIN/llvm-objdump*
            if [[ "$OSTYPE" == "darwin"* ]]; then
              strip -x $LLVM_BIN/* 2>/dev/null || true
            elif [ "${{ matrix.os_name }}" != "linux-x86" ]; then
              strip --strip-unneeded $LLVM_BIN/* 2>/dev/null || true
            fi
            $LLVM_BIN/clang --version >/dev/null
            if [ -x "$LLVM_BIN/ld.lld" ]; then $LLVM_BIN/ld.lld --version >/dev/null; fi
          fi

      - name: Run language, integration, and end-to-end tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then
            export SDKROOT=$(xcrun --show-sdk-path)
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          ERRORS=0
          FAILED_FILES=()

          while IFS= read -r -d '' file; do
            echo "Running test: $file"

            rm -f test_bin test_bin.exe
            if ! "$WLC" "$file" -o test_bin; then
              echo "::error file=$file::Compilation Failed"
              FAILED_FILES+=("[Compile Error] $file")
              ERRORS=$((ERRORS+1))
              continue
            fi

            if [ -f "test_bin.exe" ]; then
              TEST_BIN="./test_bin.exe"
            else
              TEST_BIN="./test_bin"
            fi

            set +e
            OUTPUT=$($TEST_BIN 2>&1)
            STATUS=$?
            set -e
            if [ $STATUS -ne 0 ] || ! grep -Fq "PASS:" <<< "$OUTPUT"; then
              echo "::error file=$file::Test Logic Failed"
              echo "Output: $OUTPUT"
              FAILED_FILES+=("[Runtime Error] $file")
              ERRORS=$((ERRORS+1))
            fi

            rm -f test_bin test_bin.exe
          done < <(find source_repo/tests -type f -name "*.wl" ! -path "*/ffi/*" ! -path "*/failures/*" ! -path "*/fixtures/*" -print0)

          if [ $ERRORS -ne 0 ]; then
            echo "------------------------------------------"
            echo "POSITIVE TEST SUMMARY: $ERRORS tests failed"
            for failed in "${FAILED_FILES[@]}"; do
              echo "  - $failed"
            done
            echo "------------------------------------------"
            exit 1
          fi
          echo "All language, integration, and end-to-end tests passed."

      - name: Run diagnostic tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then
            export SDKROOT=$(xcrun --show-sdk-path)
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          ERRORS=0
          FAILED_FILES=()

          while IFS= read -r -d '' file; do
            echo "Running diagnostic: $file"
            EXPECTED=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$file" | head -n 1)
            if [ -z "$EXPECTED" ]; then
              echo "::error file=$file::Missing Expected Error declaration"
              FAILED_FILES+=("[Missing Metadata] $file")
              ERRORS=$((ERRORS+1))
              continue
            fi

            rm -f diagnostic_bin diagnostic_bin.exe
            set +e
            BUILD_OUTPUT=$("$WLC" "$file" -o diagnostic_bin 2>&1)
            BUILD_STATUS=$?
            set -e
            RUN_OUTPUT=""
            RUN_STATUS=0

            if [ $BUILD_STATUS -eq 0 ]; then
              if [ -f "diagnostic_bin.exe" ]; then
                DIAGNOSTIC_BIN="./diagnostic_bin.exe"
              else
                DIAGNOSTIC_BIN="./diagnostic_bin"
              fi
              set +e
              RUN_OUTPUT=$($DIAGNOSTIC_BIN 2>&1)
              RUN_STATUS=$?
              set -e
            fi

            OUTPUT="$BUILD_OUTPUT"
            if [ -n "$RUN_OUTPUT" ]; then
              OUTPUT="${OUTPUT}"$'\n'"${RUN_OUTPUT}"
            fi

            if [ $BUILD_STATUS -eq 0 ] && [ $RUN_STATUS -eq 0 ]; then
              echo "::error file=$file::Test was expected to fail but completed successfully"
              echo "Expected: $EXPECTED"
              FAILED_FILES+=("[Unexpected Success] $file")
              ERRORS=$((ERRORS+1))
            elif ! grep -Fq "$EXPECTED" <<< "$OUTPUT"; then
              echo "::error file=$file::Expected diagnostic was not produced"
              echo "Expected: $EXPECTED"
              echo "Compiler exit: $BUILD_STATUS; program exit: $RUN_STATUS"
              echo "Output: $OUTPUT"
              FAILED_FILES+=("[Diagnostic Mismatch] $file")
              ERRORS=$((ERRORS+1))
            fi

            rm -f diagnostic_bin diagnostic_bin.exe
          done < <(find source_repo/tests/diagnostics/failures -type f -name "*.wl" -print0)

          if [ $ERRORS -ne 0 ]; then
            echo "------------------------------------------"
            echo "DIAGNOSTIC TEST SUMMARY: $ERRORS tests failed"
            for failed in "${FAILED_FILES[@]}"; do
              echo "  - $failed"
            done
            echo "------------------------------------------"
            exit 1
          fi
          echo "All diagnostic tests passed."

      - name: Run FFI tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then
            export SDKROOT=$(xcrun --show-sdk-path)
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          WLC="$PWD/release_pkg/bin/wlc"
          [ -f "${WLC}.exe" ] && WLC="${WLC}.exe"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang"
          [ -f "${CLANG}.exe" ] && CLANG="${CLANG}.exe"
          FFI_DIR="$PWD/source_repo/tests/integration/ffi"

          cd "$FFI_DIR"
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_lib_export.so libtest_lib_export.so libtest_lib_export.dylib
          rm -f test_wl_host test_wl_host.exe
          if [[ "${{ matrix.os_name }}" != windows-* ]]; then
            rm -f test_c_host test_c_host.exe
          fi

          if [[ "${{ matrix.os_name }}" == windows-* ]]; then
            "$WLC" test_lib_export.wl --shared
          else
            "$WLC" test_lib_export.wl --shared
          fi

          if [[ "${{ matrix.os_name }}" == windows-* ]]; then
            SHARED_LIB="test_lib_export.dll"
            WL_LINK_LIB="test_lib_export.lib"
            C_HOST="./test_c_host.exe"
            WL_HOST="test_wl_host.exe"
            if [ ! -f "$WL_LINK_LIB" ]; then
              echo "::error::Windows shared build did not produce the import library '$WL_LINK_LIB'."
              exit 1
            fi
          elif [[ "${{ matrix.os_name }}" == macos-* ]]; then
            SHARED_LIB="libtest_lib_export.dylib"
            WL_LINK_LIB="$SHARED_LIB"
            cp "$SHARED_LIB" test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,@loader_path -o test_c_host
            C_HOST="./test_c_host"
            WL_HOST="test_wl_host"
            export DYLD_LIBRARY_PATH="$PWD${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            SHARED_LIB="libtest_lib_export.so"
            WL_LINK_LIB="$SHARED_LIB"
            cp "$SHARED_LIB" test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,'$ORIGIN' -o test_c_host
            C_HOST="./test_c_host"
            WL_HOST="test_wl_host"
            export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi

          C_OUTPUT=$($C_HOST 2>&1)
          echo "$C_OUTPUT"
          grep -Fq "PASS:" <<< "$C_OUTPUT"

          if [ "${{ matrix.os_name }}" == "linux-x86" ]; then
            PYTHON_OUTPUT=$(docker run --rm --platform linux/386 -v "$PWD:/ffi" -w /ffi i386/debian:bookworm-slim sh -c 'apt-get update >/dev/null && apt-get install -y --no-install-recommends python3 >/dev/null && LD_LIBRARY_PATH=/ffi python3 test_dll_host.py' 2>&1)
          else
            if command -v python3 >/dev/null 2>&1; then
              PYTHON=python3
            else
              PYTHON=python
            fi
            PYTHON_OUTPUT=$($PYTHON test_dll_host.py 2>&1)
          fi
          echo "$PYTHON_OUTPUT"
          grep -Fq "PASS:" <<< "$PYTHON_OUTPUT"

          "$WLC" test_dll_host.wl "$WL_LINK_LIB" -o "$WL_HOST"
          WL_OUTPUT=$(./"$WL_HOST" 2>&1)
          echo "$WL_OUTPUT"
          grep -Fq "PASS:" <<< "$WL_OUTPUT"

          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_lib_export.so libtest_lib_export.so libtest_lib_export.dylib
          rm -f test_c_host test_c_host.exe test_wl_host test_wl_host.exe
          echo "All FFI tests passed."

      - name: "[Windows] Compile InnoSetup Installer"
        if: startsWith(matrix.os_name, 'windows')
        shell: powershell
        run: |
          mkdir -Force Output
          $tagVersion = "$env:VERSION_NO_V"
          $outName = "WhiteLanguage-Windows-${{ matrix.package_arch }}-Setup-$tagVersion"
          iscc /dAppVersion="$tagVersion" /dAppArch="${{ matrix.package_arch }}" /O"Output" /F"$outName" whitelang.iss

      - name: "[Unix] Compress Tarball"
        if: startsWith(matrix.os_name, 'windows') == false
        shell: bash
        run: |
          cd release_pkg
          tar -czf ../Output/${{ matrix.artifact }} .

      - name: "[Windows] Create Portable Zip"
        if: startsWith(matrix.os_name, 'windows')
        shell: pwsh
        run: |
          $tagVersion = "$env:VERSION_NO_V"
          $zipName = "WhiteLanguage-Windows-${{ matrix.package_arch }}-Portable-$tagVersion.zip"
          Compress-Archive -Path "release_pkg\*" -DestinationPath "Output\$zipName" -Force

      - name: Prepare Final Versioned Names
        id: prep_name
        shell: bash
        run: |
          VERSION="$VERSION_NO_V"
          cd Output
          if [ -f "whitelang-${{ matrix.os_name }}.tar.gz" ]; then
            mv "whitelang-${{ matrix.os_name }}.tar.gz" "whitelang-${{ matrix.os_name }}-${VERSION}.tar.gz"
          fi

      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}
          path: Output/
          retention-days: 7

      - name: Store bootstrap snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os_name }}
          path: Output_Snapshots/
          if-no-files-found: ignore
          retention-days: 7

  build-linux-armv7:
    name: Build for linux-armv7
    needs: [prepare-release, build-and-package]
    if: >-
      always() &&
      needs.prepare-release.outputs.build_armv7 == 'true' &&
      (needs.build-and-package.result == 'success' || needs.build-and-package.result == 'failure')
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
      VERSION_NO_V: ${{ needs.prepare-release.outputs.version }}
      FULL_RELEASE: ${{ needs.prepare-release.outputs.full_release }}

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout White Language source
        uses: actions/checkout@v4
        with:
          repository: whitelanguage/white
          path: source_repo
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Restore native Linux x64 build
        uses: actions/download-artifact@v4
        with:
          name: assets-linux-x64
          path: host_dl

      - name: Prepare ARMv7 cross build environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          sudo systemctl restart systemd-binfmt
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            echo "::error::Could not register the ARMv7 binary format handler."
            exit 1
          fi

          mkdir -p arm_dl host_env release_pkg/bin release_pkg/std Output Output_Snapshots
          PREV_TAG=$(gh release list -R ${{ github.repository }} --exclude-drafts --json tagName --jq '.[].tagName' | grep -v "^${TARGET_REF}$" | grep -v '^temp$' | grep -v "snapshot" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find a previous release for linux-armv7."
            exit 1
          fi

          gh release download "$PREV_TAG" -R ${{ github.repository }} --pattern "whitelang-linux-armv7-*.tar.gz" --dir arm_dl --clobber
          tar -xzf arm_dl/*.tar.gz -C release_pkg

          HOST_ARCHIVE=$(find host_dl -maxdepth 1 -type f -name 'whitelang-linux-x64-*.tar.gz' -print -quit)
          if [ -z "$HOST_ARCHIVE" ]; then
            echo "::error::Could not obtain a native Linux x64 compiler for ARMv7 cross compilation."
            exit 1
          fi
          tar -xzf "$HOST_ARCHIVE" -C host_env

          # keep cross links on packaged LLD instead of the runner's x86 GNU ld
          HOST_LLVM="$PWD/host_env/tools/llvm/bin"
          ARM_LLVM="$PWD/release_pkg/tools/llvm/bin"
          if [ ! -x "$HOST_LLVM/ld.lld" ] || [ ! -x "$ARM_LLVM/ld.lld" ]; then
            echo "::error::The native or ARMv7 compiler package does not contain ld.lld."
            exit 1
          fi
          printf '%s\n' '-fuse-ld=lld' '--gcc-toolchain=/usr' > "$HOST_LLVM/armv7-unknown-linux-gnueabihf.cfg"
          cp "$HOST_LLVM/armv7-unknown-linux-gnueabihf.cfg" "$HOST_LLVM/armv7-unknown-linux-gnueabihf-clang.cfg"
          printf '%s\n' '-fuse-ld=lld' '--gcc-toolchain=/usr' > "$ARM_LLVM/armv7-unknown-linux-gnueabihf.cfg"
          cp "$ARM_LLVM/armv7-unknown-linux-gnueabihf.cfg" "$ARM_LLVM/armv7-unknown-linux-gnueabihf-clang.cfg"
          cp "$ARM_LLVM/armv7-unknown-linux-gnueabihf.cfg" "$ARM_LLVM/clang.cfg"

          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"

      - name: Cross-build, validate, and package ARMv7
        shell: bash
        run: |
          set -euo pipefail
          cd source_repo
          git config --global --add safe.directory "$PWD"

          FINAL_COMMIT=$(git rev-parse "$TARGET_REF^{commit}")
          RELEASE_VERSION=${TARGET_REF#v}
          COMMIT_DATE=$(git show -s --format=%cs "$FINAL_COMMIT")
          CROSS_TARGET=armv7-unknown-linux-gnueabihf
          QEMU_ROOT=/usr/arm-linux-gnueabihf
          export QEMU_LD_PREFIX="$QEMU_ROOT"
          HOST_ENV="$GITHUB_WORKSPACE/host_env"
          HOST_WLC="$HOST_ENV/bin/wlc"
          ARM_ENV="$GITHUB_WORKSPACE/release_pkg"
          ARM_WLC="$ARM_ENV/bin/wlc"

          if [ ! -x "$HOST_WLC" ] || [ ! -x "$HOST_ENV/tools/llvm/bin/clang" ]; then
            echo "::error::The native Linux x64 compiler package is incomplete."
            exit 1
          fi
          if [ ! -x "$ARM_ENV/tools/llvm/bin/clang" ]; then
            echo "::error::The ARMv7 release toolchain is incomplete."
            exit 1
          fi

          stamp_release_metadata() {
            awk -v version="$RELEASE_VERSION" -v revision="$FINAL_COMMIT" -v commit_date="$COMMIT_DATE" '
              BEGIN { versions = 0; revisions = 0; dates = 0 }
              /^[[:space:]]*const[[:space:]]+VERSION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" version "\";"); print; versions++; next }
              /^[[:space:]]*const[[:space:]]+REVISION[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" revision "\";"); print; revisions++; next }
              /^[[:space:]]*const[[:space:]]+COMMIT_DATE[[:space:]]*(->|:)[[:space:]]*String[[:space:]]*=/ { sub(/=.*/, "= \"" commit_date "\";"); print; dates++; next }
              { print }
              END { if (versions != 1 || revisions != 1 || dates != 1) exit 2 }
            ' src/wlc.wl > src/wlc.wl.release || {
              rm -f src/wlc.wl.release
              echo "::error::Could not stamp release metadata in src/wlc.wl."
              exit 1
            }
            mv src/wlc.wl.release src/wlc.wl
          }
          compile_arm() { WL_PATH="$HOST_ENV" "$HOST_WLC" "$@" --target="$CROSS_TARGET"; }
          run_arm() { WL_PATH="$ARM_ENV" qemu-arm -L "$QEMU_ROOT" "$@"; }
          emit_host_ir() {
            rm -f src/wlc.ll
            WL_PATH="$ARM_ENV" "$HOST_WLC" src/wlc.wl -S --emit-llvm -Oz --target="$CROSS_TARGET"
            test -s src/wlc.ll
            mv src/wlc.ll "$1"
          }
          emit_arm_ir() {
            rm -f src/wlc.ll
            timeout 600s env WL_PATH="$ARM_ENV" qemu-arm -L "$QEMU_ROOT" "$ARM_WLC" src/wlc.wl -S --emit-llvm -Oz
            test -s src/wlc.ll
            mv src/wlc.ll "$1"
          }

          stamp_release_metadata
          rm -rf "$ARM_ENV/bin" "$ARM_ENV/std" "$ARM_ENV/runtime"
          mkdir -p "$ARM_ENV/bin" "$ARM_ENV/std"
          cp -a std/. "$ARM_ENV/std/"

          echo "Cross-compiling the ARMv7 compiler from native Linux x64..."
          compile_arm src/wlc.wl -o "$ARM_WLC" -Oz
          chmod +x "$ARM_WLC"

          echo "Checking the ARMv7 frontend fixed point..."
          emit_host_ir "$GITHUB_WORKSPACE/wlc_host.ll"
          emit_arm_ir "$GITHUB_WORKSPACE/wlc_arm.ll"
          diff -u "$GITHUB_WORKSPACE/wlc_host.ll" "$GITHUB_WORKSPACE/wlc_arm.ll"
          rm -f "$GITHUB_WORKSPACE/wlc_host.ll" "$GITHUB_WORKSPACE/wlc_arm.ll"

          echo "Checking the packaged ARMv7 driver..."
          run_arm "$ARM_WLC" --version
          timeout 600s env WL_PATH="$ARM_ENV" qemu-arm -L "$QEMU_ROOT" "$ARM_WLC" tests/integration/os/test_sys_platform.wl -o "$GITHUB_WORKSPACE/arm_wlc_smoke"
          SMOKE_OUTPUT=$(run_arm "$GITHUB_WORKSPACE/arm_wlc_smoke" 2>&1)
          printf '%s\n' "$SMOKE_OUTPUT" | grep -Fq 'PASS:'
          rm -f "$GITHUB_WORKSPACE/arm_wlc_smoke"

          ERRORS=0
          find tests -type f -name '*.wl' ! -path '*/ffi/*' ! -path '*/failures/*' ! -path '*/fixtures/*' | sort > "$GITHUB_WORKSPACE/positive-tests.txt"
          while IFS= read -r TEST_FILE; do
            echo "Running test: $TEST_FILE"
            TEST_BIN="$GITHUB_WORKSPACE/test_bin"
            rm -f "$TEST_BIN"
            if ! compile_arm "$TEST_FILE" -o "$TEST_BIN"; then
              ERRORS=$((ERRORS + 1))
              continue
            fi
            OUTPUT=$(run_arm "$TEST_BIN" 2>&1) || STATUS=$?
            STATUS=${STATUS:-0}
            if [ "$STATUS" -ne 0 ] || ! printf '%s\n' "$OUTPUT" | grep -Fq 'PASS:'; then
              printf '%s\n' "$OUTPUT"
              ERRORS=$((ERRORS + 1))
            fi
            unset STATUS
          done < "$GITHUB_WORKSPACE/positive-tests.txt"
          if [ "$ERRORS" -ne 0 ]; then echo "$ERRORS positive tests failed" >&2; exit 1; fi

          find tests/diagnostics/failures -type f -name '*.wl' | sort > "$GITHUB_WORKSPACE/diagnostic-tests.txt"
          while IFS= read -r TEST_FILE; do
            EXPECTED=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$TEST_FILE" | head -n 1)
            if [ -z "$EXPECTED" ]; then echo "missing Expected Error declaration: $TEST_FILE" >&2; exit 1; fi
            rm -f "$GITHUB_WORKSPACE/diagnostic_bin"
            BUILD_OUTPUT=$(compile_arm "$TEST_FILE" -o "$GITHUB_WORKSPACE/diagnostic_bin" 2>&1) || BUILD_STATUS=$?
            BUILD_STATUS=${BUILD_STATUS:-0}
            RUN_OUTPUT=""
            RUN_STATUS=0
            if [ "$BUILD_STATUS" -eq 0 ]; then
              RUN_OUTPUT=$(run_arm "$GITHUB_WORKSPACE/diagnostic_bin" 2>&1) || RUN_STATUS=$?
            fi

            OUTPUT="$BUILD_OUTPUT"
            if [ -n "$RUN_OUTPUT" ]; then
              OUTPUT="${OUTPUT}"$'\n'"${RUN_OUTPUT}"
            fi
            if [ "$BUILD_STATUS" -eq 0 ] && [ "$RUN_STATUS" -eq 0 ]; then
              echo "diagnostic test completed successfully: $TEST_FILE" >&2
              echo "expected: $EXPECTED" >&2
              exit 1
            fi
            if ! printf '%s\n' "$OUTPUT" | grep -Fq "$EXPECTED"; then
              printf '%s\n' "$OUTPUT"
              echo "expected diagnostic was not produced: $EXPECTED" >&2
              exit 1
            fi
            unset BUILD_STATUS RUN_STATUS
          done < "$GITHUB_WORKSPACE/diagnostic-tests.txt"

          FFI=tests/integration/ffi
          cd "$FFI"
          rm -f test_lib_export.so libtest_lib_export.so test_c_host test_wl_host
          compile_arm test_lib_export.wl --shared
          arm-linux-gnueabihf-gcc test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,'$ORIGIN' -o test_c_host
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          C_OUTPUT=$(qemu-arm -L "$QEMU_ROOT" ./test_c_host 2>&1)
          printf '%s\n' "$C_OUTPUT" | grep -Fq 'PASS:'
          compile_arm test_dll_host.wl libtest_lib_export.so -o test_wl_host
          WL_OUTPUT=$(qemu-arm -L "$QEMU_ROOT" ./test_wl_host 2>&1)
          printf '%s\n' "$WL_OUTPUT" | grep -Fq 'PASS:'
          echo "ARMv7 Python FFI is covered by native Linux jobs; C and White hosts cover the ARMv7 ABI."

          tar -czf "$GITHUB_WORKSPACE/Output/whitelang-linux-armv7-$VERSION_NO_V.tar.gz" -C "$ARM_ENV" .

      - name: Store ARMv7 release asset
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux-armv7
          path: Output/
          retention-days: 7

      - name: Store ARMv7 bootstrap snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-linux-armv7
          path: Output_Snapshots/
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Stage and publish release assets
    needs: [prepare-release, build-and-package, build-linux-armv7]
    if: always() && needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.verify.outputs.complete }}
    steps:
      - name: Locate the original release run
        id: source-run
        if: needs.prepare-release.outputs.full_release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            if ! printf '%s\n' "$REQUESTED_RUN_ID" | grep -Eq '^[0-9]+$'; then
              echo "::error::source_run_id must be a numeric workflow run ID."
              exit 1
            fi
            RUN_ID="$REQUESTED_RUN_ID"
          else
            TARGET_SHA=$(gh api "repos/${{ github.repository }}/commits/$TARGET_REF" --jq '.sha')
            RUN_ID=$(gh run list -R ${{ github.repository }} --workflow "${{ github.workflow }}" --commit "$TARGET_SHA" --limit 20 --json databaseId --jq '.[0].databaseId')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No earlier release run was found for $TARGET_REF."
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Recover assets from the previous run
        if: steps.source-run.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
        run: |
          mkdir -p recovered_assets all_assets
          echo "Recovering successful assets from workflow run $RUN_ID..."
          if ! gh run download "$RUN_ID" -R ${{ github.repository }} --pattern 'assets-*' --dir recovered_assets; then
            echo "No unexpired release artifacts were available in run $RUN_ID."
            exit 0
          fi
          find recovered_assets -type f -exec cp -f {} all_assets/ \;

      - name: Download assets built in this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: current_assets
          pattern: assets-*
          merge-multiple: true

      - name: Merge current release assets
        shell: bash
        run: |
          mkdir -p all_assets
          if [ -d current_assets ]; then
            find current_assets -maxdepth 1 -type f -exec cp -f {} all_assets/ \;
          fi

      - name: Recover snapshots from the previous run
        if: steps.source-run.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
        run: |
          mkdir -p recovered_snapshots all_snapshots
          if ! gh run download "$RUN_ID" -R ${{ github.repository }} --pattern 'snapshots-*' --dir recovered_snapshots; then exit 0; fi
          find recovered_snapshots -type f -exec cp -f {} all_snapshots/ \;

      - name: Download snapshots built in this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: current_snapshots
          pattern: snapshots-*
          merge-multiple: true

      - name: Stage successful release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          shopt -s nullglob
          assets=(all_assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::No successful release assets were produced or recovered."
            exit 0
          fi

          if ! gh release view "$TARGET_REF" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "$TARGET_REF" -R ${{ github.repository }} --draft --title "White Language ${TARGET_REF#v}"
          fi
          gh release upload "$TARGET_REF" -R ${{ github.repository }} "${assets[@]}" --clobber

      - name: Stage bootstrap snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          mkdir -p all_snapshots
          if [ -d current_snapshots ]; then
            find current_snapshots -maxdepth 1 -type f -exec cp -f {} all_snapshots/ \;
          fi
          shopt -s nullglob
          snapshots=(all_snapshots/*)
          if [ ${#snapshots[@]} -eq 0 ]; then exit 0; fi

          SNAPSHOT_TAG="${TARGET_REF}-snapshots"
          if ! gh release view "$SNAPSHOT_TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "$SNAPSHOT_TAG" -R ${{ github.repository }} --prerelease --title "snapshots-${TARGET_REF}"
          fi
          gh release upload "$SNAPSHOT_TAG" -R ${{ github.repository }} "${snapshots[@]}" --clobber

      - name: Verify and publish the complete release
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ needs.prepare-release.outputs.release_tag }}
          VERSION_NO_V: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TARGET_REF" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "::error::The release has no staged assets. Repair a failed platform and run again."
            exit 1
          fi

          gh release view "$TARGET_REF" -R ${{ github.repository }} --json assets --jq '.assets[].name' > release-assets.txt
          expected=(
            "WhiteLanguage-Windows-x64-Setup-${VERSION_NO_V}.exe"
            "WhiteLanguage-Windows-x64-Portable-${VERSION_NO_V}.zip"
            "WhiteLanguage-Windows-x32-Setup-${VERSION_NO_V}.exe"
            "WhiteLanguage-Windows-x32-Portable-${VERSION_NO_V}.zip"
            "whitelang-macos-arm64-${VERSION_NO_V}.tar.gz"
            "whitelang-macos-x64-${VERSION_NO_V}.tar.gz"
            "whitelang-linux-x64-${VERSION_NO_V}.tar.gz"
            "whitelang-linux-x86-${VERSION_NO_V}.tar.gz"
            "whitelang-linux-arm64-${VERSION_NO_V}.tar.gz"
            "whitelang-linux-armv7-${VERSION_NO_V}.tar.gz"
          )

          missing=0
          for asset in "${expected[@]}"; do
            if ! grep -Fxq "$asset" release-assets.txt; then
              echo "::notice::Missing release asset: $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The draft has $missing missing asset(s). Repair only those platforms and run again."
            exit 1
          fi

          gh release edit "$TARGET_REF" -R ${{ github.repository }} --draft=false --latest
          echo "complete=true" >> "$GITHUB_OUTPUT"

  promote-to-r2:
    name: Sync Assets to Cloudflare R2
    needs: [prepare-release, publish-release]
    if: needs.publish-release.outputs.complete == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p all_assets
          gh release download "${{ needs.prepare-release.outputs.release_tag }}" -R ${{ github.repository }} --dir all_assets

      - name: Sync to R2 Selective (Dots Logic)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          TAG="${{ needs.prepare-release.outputs.release_tag }}"
          DOT_COUNT=$(echo $TAG | tr -cd '.' | wc -c)

          if [ "$DOT_COUNT" -eq 1 ]; then
            aws s3 sync all_assets/ s3://${{ secrets.R2_BUCKET_NAME }}/${TAG}/ \
              --exclude "*Portable*" \
              --delete \
              --endpoint-url ${{ secrets.R2_ENDPOINT }}

            aws s3 sync all_assets/ s3://${{ secrets.R2_BUCKET_NAME }}/latest/ \
              --exclude "*Portable*" \
              --delete \
              --endpoint-url ${{ secrets.R2_ENDPOINT }}
          fi

  sync-latest-to-r2:
    name: Sync Latest Release to Cloudflare R2
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-r2'
    runs-on: ubuntu-latest
    steps:
      - name: Download latest release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -R ${{ github.repository }} --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No published release was found."
            exit 1
          fi
          mkdir -p all_assets
          gh release download "$TAG" -R ${{ github.repository }} --dir all_assets
          if [ -z "$(find all_assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::Release '$TAG' has no assets."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Sync latest release assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync all_assets/ "s3://${{ secrets.R2_BUCKET_NAME }}/$TAG/" \
            --exclude "*Portable*" \
            --delete \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

          aws s3 sync all_assets/ "s3://${{ secrets.R2_BUCKET_NAME }}/latest/" \
            --exclude "*Portable*" \
            --delete \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

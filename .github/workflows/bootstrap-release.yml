name: White Language Transitional Bootstrap

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  RAW_TAG: temp
  SOURCE_REF: v0.3.2
  BOOTSTRAP_TAG: bootstrap-v0.3.2
  PACKAGE_VERSION: 0.3.2-bootstrap

jobs:
  prepare:
    name: Prepare transitional release
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'temp'
    runs-on: ubuntu-latest
    steps:
      - name: Check raw compiler release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$RAW_TAG" --repo "${{ github.repository }}"

      - name: Create transitional release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$BOOTSTRAP_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$BOOTSTRAP_TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "White Language transitional bootstrap" --notes "Temporary native bootstrap packages for v0.3.2." --prerelease
          fi

  windows-x32:
    name: Bootstrap Windows x32
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout White Language v0.3.2
        uses: actions/checkout@v4
        with:
          repository: pangbai520/White-Language
          path: source_repo
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Download raw compiler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw
          gh release download "$RAW_TAG" --repo "${{ github.repository }}" --pattern "WhiteLanguage-Windows-x32-*.exe" --dir raw --clobber
          RAW_COUNT=$(find raw -maxdepth 1 -type f -name '*.exe' | wc -l)
          if [ "$RAW_COUNT" -ne 1 ]; then echo "::error::Expected one Windows x32 compiler in the temp release, found $RAW_COUNT."; exit 1; fi
          mv "$(find raw -maxdepth 1 -type f -name '*.exe')" raw/wlc.exe

      - name: Stage x86 LLVM-MinGW
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo mstorsjo/llvm-mingw --json assets -q '[.assets[] | select(.name | contains("ucrt-i686.zip")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = null ]; then echo "::error::No ucrt-i686 LLVM-MinGW archive was found."; exit 1; fi
          curl --fail --location --retry 3 --output llvm.zip "$URL"
          mkdir -p llvm_full release_pkg/bin release_pkg/std release_pkg/tools
          unzip -q llvm.zip -d llvm_full
          LLVM_ROOT=$(find llvm_full -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$LLVM_ROOT" ] || [ ! -f "$LLVM_ROOT/bin/clang.exe" ]; then echo "::error::The x86 LLVM archive is incomplete."; exit 1; fi
          mv "$LLVM_ROOT" release_pkg/tools/llvm
          cp -a source_repo/std/. release_pkg/std/
          printf '%s\n' '-fuse-ld=lld' '-L<CFGDIR>/../i686-w64-mingw32/lib' > release_pkg/tools/llvm/bin/i686-pc-windows-msvc.cfg
          cp release_pkg/tools/llvm/bin/i686-pc-windows-msvc.cfg release_pkg/tools/llvm/bin/i686-pc-windows-msvc-clang.cfg

      - name: Bootstrap three generations
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/release_pkg")
          export PATH="$PWD/release_pkg/tools/llvm/bin:$PATH"
          mkdir -p generations
          RAW=$(cygpath -m "$PWD/raw/wlc.exe")
          STAGE1=$(cygpath -m "$PWD/generations/wlc-stage1.exe")
          STAGE2=$(cygpath -m "$PWD/generations/wlc-stage2.exe")
          STAGE3=$(cygpath -m "$PWD/generations/wlc-stage3.exe")
          "$RAW" source_repo/src/wlc.wl -Oz --keep-temps -o "$STAGE1"
          cp source_repo/src/wlc.ll generations/stage1.ll
          "$STAGE1" source_repo/src/wlc.wl -Oz --keep-temps -o "$STAGE2"
          cp source_repo/src/wlc.ll generations/stage2.ll
          "$STAGE2" source_repo/src/wlc.wl -Oz --keep-temps -o "$STAGE3"
          cp source_repo/src/wlc.ll generations/stage3.ll
          rm -f source_repo/src/wlc.ll
          if ! cmp -s generations/stage2.ll generations/stage3.ll; then echo "::error::Windows x32 bootstrap did not reach an IR fixed point."; exit 1; fi
          cp generations/wlc-stage3.exe release_pkg/bin/wlc.exe

      - name: Prepare x86 C FFI host
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/release_pkg")
          WLC="$PWD/release_pkg/bin/wlc.exe"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang.exe"
          cd source_repo/tests/integration/ffi
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp test_c_host.exe
          "$WLC" test_lib_export.wl --shared
          if [ ! -f test_lib_export.lib ]; then echo "::error::Windows shared build did not produce its import library."; exit 1; fi
          "$CLANG" test_dll_host.c test_lib_export.lib -o test_c_host.exe
          rm -f test_lib_export.dll test_lib_export.lib test_lib_export.exp

      - name: Trim x86 LLVM
        shell: bash
        run: |
          LLVM_DIR=release_pkg/tools/llvm
          rm -rf "$LLVM_DIR/python" "$LLVM_DIR/busybox" "$LLVM_DIR/share" "$LLVM_DIR/include" "$LLVM_DIR/LICENSE.TXT"
          rm -rf "$LLVM_DIR/aarch64-w64-mingw32" "$LLVM_DIR/arm64ec-w64-mingw32" "$LLVM_DIR/armv7-w64-mingw32" "$LLVM_DIR/x86_64-w64-mingw32"
          rm -rf "$LLVM_DIR/i686-w64-mingw32/share" "$LLVM_DIR/i686-w64-mingw32/bin" "$LLVM_DIR/lib/libear" "$LLVM_DIR/lib/libscanbuild"
          CLANG_VER_DIR=$(find "$LLVM_DIR/lib/clang" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          rm -rf "$CLANG_VER_DIR/lib/linux" "$CLANG_VER_DIR/bin" "$CLANG_VER_DIR/share"
          rm -f "$LLVM_DIR"/bin/libpython*.dll "$LLVM_DIR"/bin/aarch64-* "$LLVM_DIR"/bin/armv7-* "$LLVM_DIR"/bin/arm64ec-* "$LLVM_DIR"/bin/x86_64-* "$LLVM_DIR"/bin/*mingw32uwp*
          rm -f "$LLVM_DIR"/bin/lldb* "$LLVM_DIR"/bin/liblldb* "$LLVM_DIR"/bin/clang-format* "$LLVM_DIR"/bin/clang-tidy* "$LLVM_DIR"/bin/clangd*
          rm -f "$LLVM_DIR"/bin/llvm-objdump* "$LLVM_DIR"/bin/llvm-pdbutil* "$LLVM_DIR"/bin/clang-scan-deps* "$LLVM_DIR"/bin/llvm-dlltool.exe
          rm -f "$LLVM_DIR"/bin/libclang_rt.asan_dynamic-*.dll "$LLVM_DIR"/bin/{libffi-8.dll,libomp.dll}
          rm -f "$LLVM_DIR/i686-w64-mingw32/lib"/libd3d*.a "$LLVM_DIR/i686-w64-mingw32/lib"/libd2d*.a "$LLVM_DIR/i686-w64-mingw32/lib"/libx3d*.a
          rm -f "$LLVM_DIR/i686-w64-mingw32/lib"/libxaudio*.a "$LLVM_DIR/i686-w64-mingw32/lib"/libxinput*.a "$LLVM_DIR/i686-w64-mingw32/lib"/libmf*.a
          rm -f "$LLVM_DIR/i686-w64-mingw32/lib"/libwindows.*.a "$LLVM_DIR/i686-w64-mingw32/lib"/libc++*.a

      - name: Run Windows x32 tests
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/release_pkg")
          WLC="$PWD/release_pkg/bin/wlc.exe"
          ERRORS=0
          while IFS= read -r -d '' FILE; do
            rm -f test_bin.exe
            if ! "$WLC" "$FILE" -o test_bin.exe; then ERRORS=$((ERRORS + 1)); continue; fi
            set +e
            OUTPUT=$(./test_bin.exe 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] || ! grep -Fq 'PASS:' <<< "$OUTPUT"; then echo "$OUTPUT"; ERRORS=$((ERRORS + 1)); fi
          done < <(find source_repo/tests -type f -name '*.wl' ! -path '*/ffi/*' ! -path '*/failures/*' ! -path '*/fixtures/*' -print0)
          if [ "$ERRORS" -ne 0 ]; then echo "::error::$ERRORS Windows x32 tests failed."; exit 1; fi

      - name: Run Windows x32 diagnostics
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/release_pkg")
          WLC="$PWD/release_pkg/bin/wlc.exe"
          while IFS= read -r -d '' FILE; do
            EXPECTED=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$FILE" | head -n 1)
            if [ -z "$EXPECTED" ]; then echo "::error file=$FILE::Missing Expected Error declaration"; exit 1; fi
            set +e
            OUTPUT=$("$WLC" "$FILE" -o diagnostic_bin.exe 2>&1)
            STATUS=$?
            if [ "$STATUS" -eq 0 ]; then OUTPUT="$OUTPUT"$'\n'"$(./diagnostic_bin.exe 2>&1)"; STATUS=$?; fi
            set -e
            if [ "$STATUS" -eq 0 ] || ! grep -Fq "$EXPECTED" <<< "$OUTPUT"; then echo "$OUTPUT"; echo "::error file=$FILE::Diagnostic mismatch"; exit 1; fi
          done < <(find source_repo/tests/diagnostics/failures -type f -name '*.wl' -print0)

      - name: Install x86 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86

      - name: Run Windows x32 FFI tests
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/release_pkg")
          WLC="$PWD/release_pkg/bin/wlc.exe"
          cd source_repo/tests/integration/ffi
          "$WLC" test_lib_export.wl --shared
          C_OUTPUT=$(./test_c_host.exe 2>&1)
          grep -Fq 'PASS:' <<< "$C_OUTPUT"
          PYTHON_OUTPUT=$(python test_dll_host.py 2>&1)
          grep -Fq 'PASS:' <<< "$PYTHON_OUTPUT"
          "$WLC" test_dll_host.wl test_lib_export.lib -o test_wl_host.exe
          WL_OUTPUT=$(./test_wl_host.exe 2>&1)
          grep -Fq 'PASS:' <<< "$WL_OUTPUT"

      - name: Package Windows x32
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          Compress-Archive -Path 'release_pkg\*' -DestinationPath "Output\WhiteLanguage-Windows-x32-Portable-$env:PACKAGE_VERSION.zip" -Force
          iscc "/dAppVersion=$env:PACKAGE_VERSION" '/dAppArch=x32' '/OOutput' "/FWhiteLanguage-Windows-x32-Setup-$env:PACKAGE_VERSION" whitelang.iss

      - name: Upload Windows x32 packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$BOOTSTRAP_TAG" Output/* --repo "${{ github.repository }}" --clobber

  macos-x64-seed:
    name: Generate macOS x64 seed IR
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout White Language v0.3.2
        uses: actions/checkout@v4
        with:
          repository: pangbai520/White-Language
          path: source_repo
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Download Windows x32 compiler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw seed_env/std seed_env/tools
          gh release download "$RAW_TAG" --repo "${{ github.repository }}" --pattern "WhiteLanguage-Windows-x32-*.exe" --dir raw --clobber
          RAW_COUNT=$(find raw -maxdepth 1 -type f -name '*.exe' | wc -l)
          if [ "$RAW_COUNT" -ne 1 ]; then echo "::error::Expected one Windows x32 compiler in the temp release, found $RAW_COUNT."; exit 1; fi
          mv "$(find raw -maxdepth 1 -type f -name '*.exe')" raw/wlc.exe
          cp -a source_repo/std/. seed_env/std/

      - name: Stage LLVM for IR emission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view --repo mstorsjo/llvm-mingw --json assets -q '[.assets[] | select(.name | contains("ucrt-i686.zip")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = null ]; then echo "::error::No ucrt-i686 LLVM-MinGW archive was found."; exit 1; fi
          curl --fail --location --retry 3 --output llvm.zip "$URL"
          mkdir -p llvm_full
          unzip -q llvm.zip -d llvm_full
          LLVM_ROOT=$(find llvm_full -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$LLVM_ROOT" seed_env/tools/llvm

      - name: Emit macOS x64 compiler IR
        shell: bash
        run: |
          export WL_PATH=$(cygpath -m "$PWD/seed_env")
          mkdir -p seed
          rm -f source_repo/src/wlc.ll seed/wlc-macos-x64.ll
          ./raw/wlc.exe source_repo/src/wlc.wl --target x86_64-apple-darwin -S --emit-llvm
          if [ ! -s source_repo/src/wlc.ll ]; then echo "::error::The macOS x64 seed IR was not generated."; exit 1; fi
          mv source_repo/src/wlc.ll seed/wlc-macos-x64.ll

      - name: Upload macOS x64 seed IR
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-seed
          path: seed/wlc-macos-x64.ll
          retention-days: 1

  native-unix:
    name: Bootstrap ${{ matrix.os_name }}
    needs:
      - prepare
      - macos-x64-seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux-arm64
            runner: ubuntu-24.04-arm
            raw_pattern: whitelang-linux-arm64-*
            llvm_keyword: Linux-ARM64.tar.xz
            artifact: whitelang-linux-arm64
          - os_name: macos-x64
            runner: macos-15-intel
            artifact: whitelang-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout White Language v0.3.2
        uses: actions/checkout@v4
        with:
          repository: pangbai520/White-Language
          path: source_repo
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Download raw Linux ARM64 compiler
        if: matrix.os_name == 'linux-arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw
          gh release download "$RAW_TAG" --repo "${{ github.repository }}" --pattern "${{ matrix.raw_pattern }}" --dir raw --clobber
          RAW_COUNT=$(find raw -maxdepth 1 -type f | wc -l)
          if [ "$RAW_COUNT" -ne 1 ]; then echo "::error::Expected one raw ${{ matrix.os_name }} compiler, found $RAW_COUNT."; exit 1; fi
          mv "$(find raw -maxdepth 1 -type f)" raw/wlc
          chmod +x raw/wlc

      - name: Download macOS x64 seed IR
        if: matrix.os_name == 'macos-x64'
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-seed
          path: raw

      - name: Stage Linux ARM64 LLVM
        if: matrix.os_name == 'linux-arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p llvm_full release_pkg/bin release_pkg/std release_pkg/tools/llvm/bin release_pkg/tools/llvm/lib
          URL=$(gh release view --repo llvm/llvm-project --json assets -q '[.assets[] | select(.name | contains("${{ matrix.llvm_keyword }}")) | .url] | .[0]')
          if [ -z "$URL" ] || [ "$URL" = null ]; then echo "::error::No LLVM archive matched ${{ matrix.llvm_keyword }}."; exit 1; fi
          curl --fail --location --retry 3 --output llvm.tar.xz "$URL"
          tar -xf llvm.tar.xz -C llvm_full --strip-components=1
          cp -a llvm_full/bin/clang llvm_full/bin/clang-[0-9]* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/ld.lld* llvm_full/bin/lld* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/bin/llvm-objdump* release_pkg/tools/llvm/bin/ 2>/dev/null || true
          cp -a llvm_full/lib/clang release_pkg/tools/llvm/lib/
          cp -a source_repo/std/. release_pkg/std/

      - name: Bundle Intel macOS LLVM
        if: matrix.os_name == 'macos-x64'
        shell: bash
        run: |
          LLVM_PREFIX=$(brew --prefix llvm 2>/dev/null || true)
          if [ -z "$LLVM_PREFIX" ] || [ ! -x "$LLVM_PREFIX/bin/clang" ]; then brew install llvm; LLVM_PREFIX=$(brew --prefix llvm); fi
          mkdir -p release_pkg/bin release_pkg/std release_pkg/tools/llvm/bin release_pkg/tools/llvm/lib
          cp -L "$LLVM_PREFIX/bin/clang" release_pkg/tools/llvm/bin/clang
          cp -L "$LLVM_PREFIX/bin/llvm-objdump" release_pkg/tools/llvm/bin/llvm-objdump
          cp -a "$LLVM_PREFIX/lib/clang" release_pkg/tools/llvm/lib/
          cp -a source_repo/std/. release_pkg/std/

          copy_dep() {
            DEP=$1
            case "$DEP" in
              /usr/local/*|/opt/homebrew/*) SOURCE=$DEP ;;
              @rpath/*) SOURCE="$LLVM_PREFIX/lib/$(basename "$DEP")" ;;
              *) return ;;
            esac
            if [ -f "$SOURCE" ]; then
              NAME=$(basename "$DEP")
              if [ ! -f "release_pkg/tools/llvm/lib/$NAME" ]; then cp -L "$SOURCE" "release_pkg/tools/llvm/lib/$NAME"; fi
            fi
          }

          collect_deps() {
            otool -L "$1" | tail -n +2 | awk '{print $1}' | while IFS= read -r DEP; do
              copy_dep "$DEP"
            done
          }

          collect_deps release_pkg/tools/llvm/bin/clang
          collect_deps release_pkg/tools/llvm/bin/llvm-objdump
          PREVIOUS=-1
          CURRENT=$(find release_pkg/tools/llvm/lib -maxdepth 1 -type f -name '*.dylib' | wc -l)
          while [ "$CURRENT" -ne "$PREVIOUS" ]; do
            PREVIOUS=$CURRENT
            while IFS= read -r LIB; do collect_deps "$LIB"; done < <(find release_pkg/tools/llvm/lib -maxdepth 1 -type f -name '*.dylib')
            CURRENT=$(find release_pkg/tools/llvm/lib -maxdepth 1 -type f -name '*.dylib' | wc -l)
          done

          rewrite_deps() {
            FILE=$1
            otool -L "$FILE" | tail -n +2 | awk '{print $1}' | while IFS= read -r DEP; do
              case "$DEP" in
                /usr/local/*|/opt/homebrew/*) install_name_tool -change "$DEP" "@rpath/$(basename "$DEP")" "$FILE" ;;
              esac
            done
          }

          for BIN in release_pkg/tools/llvm/bin/clang release_pkg/tools/llvm/bin/llvm-objdump; do
            rewrite_deps "$BIN"
            install_name_tool -add_rpath '@loader_path/../lib' "$BIN" 2>/dev/null || true
          done
          while IFS= read -r LIB; do
            rewrite_deps "$LIB"
            install_name_tool -id "@rpath/$(basename "$LIB")" "$LIB"
            install_name_tool -add_rpath '@loader_path' "$LIB" 2>/dev/null || true
          done < <(find release_pkg/tools/llvm/lib -maxdepth 1 -type f -name '*.dylib')

          export SDKROOT=$(xcrun --show-sdk-path)
          export MACOSX_DEPLOYMENT_TARGET=11.0
          release_pkg/tools/llvm/bin/clang -O2 raw/wlc-macos-x64.ll -o raw/wlc
          chmod +x raw/wlc
          printf 'int main(void) { return 0; }\n' > llvm-smoke.c
          release_pkg/tools/llvm/bin/clang llvm-smoke.c -o llvm-smoke
          ./llvm-smoke

      - name: Bootstrap three generations
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          export PATH="$PWD/release_pkg/tools/llvm/bin:$PATH"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then export SDKROOT=$(xcrun --show-sdk-path); export MACOSX_DEPLOYMENT_TARGET=11.0; fi
          mkdir -p generations
          ./raw/wlc source_repo/src/wlc.wl -Oz --keep-temps -o generations/wlc-stage1
          cp source_repo/src/wlc.ll generations/stage1.ll
          ./generations/wlc-stage1 source_repo/src/wlc.wl -Oz --keep-temps -o generations/wlc-stage2
          cp source_repo/src/wlc.ll generations/stage2.ll
          ./generations/wlc-stage2 source_repo/src/wlc.wl -Oz --keep-temps -o generations/wlc-stage3
          cp source_repo/src/wlc.ll generations/stage3.ll
          rm -f source_repo/src/wlc.ll
          if ! cmp -s generations/stage2.ll generations/stage3.ll; then echo "::error::${{ matrix.os_name }} bootstrap did not reach an IR fixed point."; exit 1; fi
          cp generations/wlc-stage3 release_pkg/bin/wlc
          chmod +x release_pkg/bin/wlc
          if [ "${{ matrix.os_name }}" != "macos-x64" ]; then rm -f release_pkg/tools/llvm/bin/llvm-objdump*; fi

      - name: Run ${{ matrix.os_name }} tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then export SDKROOT=$(xcrun --show-sdk-path); export MACOSX_DEPLOYMENT_TARGET=11.0; fi
          WLC="$PWD/release_pkg/bin/wlc"
          ERRORS=0
          while IFS= read -r -d '' FILE; do
            rm -f test_bin
            if ! "$WLC" "$FILE" -o test_bin; then ERRORS=$((ERRORS + 1)); continue; fi
            set +e
            OUTPUT=$(./test_bin 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] || ! grep -Fq 'PASS:' <<< "$OUTPUT"; then echo "$OUTPUT"; ERRORS=$((ERRORS + 1)); fi
          done < <(find source_repo/tests -type f -name '*.wl' ! -path '*/ffi/*' ! -path '*/failures/*' ! -path '*/fixtures/*' -print0)
          if [ "$ERRORS" -ne 0 ]; then echo "::error::$ERRORS ${{ matrix.os_name }} tests failed."; exit 1; fi

      - name: Run ${{ matrix.os_name }} diagnostics
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then export SDKROOT=$(xcrun --show-sdk-path); export MACOSX_DEPLOYMENT_TARGET=11.0; fi
          WLC="$PWD/release_pkg/bin/wlc"
          while IFS= read -r -d '' FILE; do
            EXPECTED=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$FILE" | head -n 1)
            if [ -z "$EXPECTED" ]; then echo "::error file=$FILE::Missing Expected Error declaration"; exit 1; fi
            set +e
            OUTPUT=$("$WLC" "$FILE" -o diagnostic_bin 2>&1)
            STATUS=$?
            if [ "$STATUS" -eq 0 ]; then OUTPUT="$OUTPUT"$'\n'"$(./diagnostic_bin 2>&1)"; STATUS=$?; fi
            set -e
            if [ "$STATUS" -eq 0 ] || ! grep -Fq "$EXPECTED" <<< "$OUTPUT"; then echo "$OUTPUT"; echo "::error file=$FILE::Diagnostic mismatch"; exit 1; fi
          done < <(find source_repo/tests/diagnostics/failures -type f -name '*.wl' -print0)

      - name: Run ${{ matrix.os_name }} FFI tests
        shell: bash
        run: |
          export WL_PATH="$PWD/release_pkg"
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then export SDKROOT=$(xcrun --show-sdk-path); export MACOSX_DEPLOYMENT_TARGET=11.0; fi
          WLC="$PWD/release_pkg/bin/wlc"
          CLANG="$PWD/release_pkg/tools/llvm/bin/clang"
          cd source_repo/tests/integration/ffi
          rm -f test_lib_export.so libtest_lib_export.so libtest_lib_export.dylib test_c_host test_wl_host
          "$WLC" test_lib_export.wl --shared
          if [[ "${{ matrix.os_name }}" == macos-* ]]; then
            cp libtest_lib_export.dylib test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,@loader_path -o test_c_host
            export DYLD_LIBRARY_PATH="$PWD${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            LIBRARY=libtest_lib_export.dylib
          else
            cp libtest_lib_export.so test_lib_export.so
            "$CLANG" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,'$ORIGIN' -o test_c_host
            export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            LIBRARY=libtest_lib_export.so
          fi
          grep -Fq 'PASS:' <<< "$(./test_c_host 2>&1)"
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          grep -Fq 'PASS:' <<< "$($PYTHON test_dll_host.py 2>&1)"
          "$WLC" test_dll_host.wl "$LIBRARY" -o test_wl_host
          grep -Fq 'PASS:' <<< "$(./test_wl_host 2>&1)"

      - name: Package and upload ${{ matrix.os_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Output
          tar -czf "Output/${{ matrix.artifact }}-$PACKAGE_VERSION.tar.gz" -C release_pkg .
          gh release upload "$BOOTSTRAP_TAG" Output/* --repo "${{ github.repository }}" --clobber

  legacy-linux:
    name: Bootstrap ${{ matrix.os_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux-x86
            platform: linux/386
            image: i386/debian:bookworm-slim
            raw_pattern: whitelang-linux-x86-*
            qemu: false
          - os_name: linux-armv7
            platform: linux/arm/v7
            image: arm32v7/debian:bookworm-slim
            raw_pattern: whitelang-linux-armv7-*
            qemu: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout White Language v0.3.2
        uses: actions/checkout@v4
        with:
          repository: pangbai520/White-Language
          path: source_repo
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Enable ARM emulation
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Download raw compiler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw Output
          gh release download "$RAW_TAG" --repo "${{ github.repository }}" --pattern "${{ matrix.raw_pattern }}" --dir raw --clobber
          RAW_COUNT=$(find raw -maxdepth 1 -type f | wc -l)
          if [ "$RAW_COUNT" -ne 1 ]; then echo "::error::Expected one raw ${{ matrix.os_name }} compiler, found $RAW_COUNT."; exit 1; fi
          mv "$(find raw -maxdepth 1 -type f)" raw/wlc

      - name: Bootstrap, test, and package ${{ matrix.os_name }}
        shell: bash
        run: |
          docker run --rm -i --platform "${{ matrix.platform }}" \
            -e PACKAGE_VERSION="$PACKAGE_VERSION" \
            -e TARGET_NAME="${{ matrix.os_name }}" \
            -v "$PWD:/workspace" \
            "${{ matrix.image }}" sh -s <<'TARGET'
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates clang libc6-dev lld patchelf pax-utils python3
          rm -rf /var/lib/apt/lists/*

          root=/workspace
          source=$root/source_repo
          package=$root/release_pkg-$TARGET_NAME
          raw=$root/raw/wlc
          rm -rf "$package"
          mkdir -p "$package/bin" "$package/std" "$package/tools/llvm/bin" "$package/tools/llvm/lib"
          cp -a "$source/std/." "$package/std/"
          chmod +x "$raw"

          clang_real=$(readlink -f "$(command -v clang)")
          lld_real=$(readlink -f "$(command -v ld.lld)")
          llvm_root=$(dirname "$(dirname "$clang_real")")
          cp "$clang_real" "$package/tools/llvm/bin/clang"
          cp "$lld_real" "$package/tools/llvm/bin/ld.lld"
          cp -a "$llvm_root/lib/clang" "$package/tools/llvm/lib/"

          deps=$root/llvm-deps-$TARGET_NAME.txt
          { lddtree -l "$clang_real"; lddtree -l "$lld_real"; } | sort -u > "$deps"
          while IFS= read -r dep; do
            [ -f "$dep" ] || continue
            name=$(basename "$dep")
            case "$name" in
              clang|lld|ld-linux*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue ;;
            esac
            cp -L "$dep" "$package/tools/llvm/lib/$name"
          done < "$deps"
          rm -f "$deps"
          patchelf --set-rpath '$ORIGIN/../lib' "$package/tools/llvm/bin/clang" "$package/tools/llvm/bin/ld.lld"
          find "$package/tools/llvm/lib" -maxdepth 1 -type f -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true

          export WL_PATH="$package"
          export PATH="$package/tools/llvm/bin:$PATH"
          cd "$source"
          mkdir -p "$root/generations-$TARGET_NAME"
          generations=$root/generations-$TARGET_NAME
          "$raw" src/wlc.wl -Oz --keep-temps -o "$generations/wlc-stage1"
          cp src/wlc.ll "$generations/stage1.ll"
          "$generations/wlc-stage1" src/wlc.wl -Oz --keep-temps -o "$generations/wlc-stage2"
          cp src/wlc.ll "$generations/stage2.ll"
          "$generations/wlc-stage2" src/wlc.wl -Oz --keep-temps -o "$generations/wlc-stage3"
          cp src/wlc.ll "$generations/stage3.ll"
          rm -f src/wlc.ll
          if ! cmp -s "$generations/stage2.ll" "$generations/stage3.ll"; then echo "$TARGET_NAME bootstrap did not reach an IR fixed point" >&2; exit 1; fi
          cp "$generations/wlc-stage3" "$package/bin/wlc"
          chmod +x "$package/bin/wlc"

          current=$package/bin/wlc
          errors=0
          find tests -type f -name '*.wl' ! -path '*/ffi/*' ! -path '*/failures/*' ! -path '*/fixtures/*' | sort > "$root/tests-$TARGET_NAME.txt"
          while IFS= read -r test_file; do
            rm -f "$root/test-bin-$TARGET_NAME"
            if ! "$current" "$test_file" -o "$root/test-bin-$TARGET_NAME"; then errors=$((errors + 1)); continue; fi
            output=$($root/test-bin-$TARGET_NAME 2>&1) || status=$?
            status=${status:-0}
            if [ "$status" -ne 0 ] || ! printf '%s\n' "$output" | grep -Fq 'PASS:'; then printf '%s\n' "$output"; errors=$((errors + 1)); fi
            unset status
          done < "$root/tests-$TARGET_NAME.txt"
          if [ "$errors" -ne 0 ]; then echo "$errors $TARGET_NAME tests failed" >&2; exit 1; fi

          find tests/diagnostics/failures -type f -name '*.wl' | sort > "$root/diagnostics-$TARGET_NAME.txt"
          while IFS= read -r test_file; do
            expected=$(sed -n 's|^// Expected Error: "\(.*\)"[[:space:]]*$|\1|p' "$test_file" | head -n 1)
            [ -n "$expected" ] || { echo "missing Expected Error declaration: $test_file" >&2; exit 1; }
            output=$($current "$test_file" -o "$root/diagnostic-$TARGET_NAME" 2>&1) || status=$?
            status=${status:-0}
            if [ "$status" -eq 0 ]; then
              run_output=$($root/diagnostic-$TARGET_NAME 2>&1) || status=$?
              output=$(printf '%s\n%s' "$output" "$run_output")
            fi
            if [ "$status" -eq 0 ] || ! printf '%s\n' "$output" | grep -Fq "$expected"; then printf '%s\n' "$output"; echo "diagnostic mismatch: $test_file" >&2; exit 1; fi
            unset status
          done < "$root/diagnostics-$TARGET_NAME.txt"

          ffi=$source/tests/integration/ffi
          cd "$ffi"
          rm -f test_lib_export.so libtest_lib_export.so test_c_host test_wl_host
          "$current" test_lib_export.wl --shared
          cp libtest_lib_export.so test_lib_export.so
          "$package/tools/llvm/bin/clang" test_dll_host.c -L. -ltest_lib_export -Wl,-rpath,'$ORIGIN' -o test_c_host
          export LD_LIBRARY_PATH="$ffi${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          printf '%s\n' "$(./test_c_host 2>&1)" | grep -Fq 'PASS:'
          printf '%s\n' "$(python3 test_dll_host.py 2>&1)" | grep -Fq 'PASS:'
          "$current" test_dll_host.wl libtest_lib_export.so -o test_wl_host
          printf '%s\n' "$(./test_wl_host 2>&1)" | grep -Fq 'PASS:'

          tar -czf "$root/Output/whitelang-$TARGET_NAME-$PACKAGE_VERSION.tar.gz" -C "$package" .
          TARGET

      - name: Upload ${{ matrix.os_name }} package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$BOOTSTRAP_TAG" Output/* --repo "${{ github.repository }}" --clobber

  verify:
    name: Verify transitional release
    needs:
      - windows-x32
      - native-unix
      - legacy-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check all release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$BOOTSTRAP_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for EXPECTED in \
            "WhiteLanguage-Windows-x32-Setup-$PACKAGE_VERSION.exe" \
            "WhiteLanguage-Windows-x32-Portable-$PACKAGE_VERSION.zip" \
            "whitelang-linux-x86-$PACKAGE_VERSION.tar.gz" \
            "whitelang-linux-arm64-$PACKAGE_VERSION.tar.gz" \
            "whitelang-linux-armv7-$PACKAGE_VERSION.tar.gz" \
            "whitelang-macos-x64-$PACKAGE_VERSION.tar.gz"; do
            if ! grep -Fxq "$EXPECTED" <<< "$ASSETS"; then echo "::error::Missing transitional asset $EXPECTED"; exit 1; fi
          done
          echo "All transitional packages are ready for the v0.3.2 pipeline."

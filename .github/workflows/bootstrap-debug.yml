name: Bootstrap Debug (Windows x64)

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Previous release used as the bootstrap seed
        required: true
        default: v0.3.2
      target_ref:
        description: Source tag or commit to bootstrap toward
        required: true
        default: v0.3.3
      stop_after:
        description: Stop after this commit prefix; leave empty to run every commit
        required: false
        default: 9867933

permissions:
  contents: read

jobs:
  bootstrap-debug:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout White Language source
        uses: actions/checkout@v4
        with:
          repository: whitelanguage/white
          path: source_repo
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Download bootstrap seed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p boot_dl boot_env
          gh release download "${{ inputs.base_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'WhiteLanguage-Windows-x64-Portable-*.zip' \
            --dir boot_dl \
            --clobber
          unzip -q boot_dl/*.zip -d boot_env

      - name: Trace bootstrap chain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p bootstrap_debug
          exec > >(tee -a bootstrap_debug/bootstrap.log) 2>&1

          source_root="$PWD/source_repo"
          active_wlc=$(find "$PWD/boot_env" -name wlc.exe -type f | head -n 1)
          if [ -z "$active_wlc" ]; then
            echo "::error::The bootstrap release does not contain wlc.exe."
            exit 1
          fi
          active_env=$(dirname "$(dirname "$active_wlc")")
          temp_dir=$(cygpath -u "$LOCALAPPDATA/Temp")

          cd "$source_root"
          commits=$(git rev-list --reverse "${{ inputs.base_tag }}..${{ inputs.target_ref }}")
          if [ -z "$commits" ]; then
            echo "::error::No commits found between the bootstrap seed and target ref."
            exit 1
          fi

          print_toolchain() {
            local commit="$1"
            echo "active commit: $commit"
            echo "active wlc: $active_wlc"
            echo "active env: $active_env"
            echo "WL_PATH: $WL_PATH"
            stat -c 'wlc size: %s bytes' "$active_wlc"
            sha256sum "$active_wlc"
            "$active_wlc" --version || true
            "$active_wlc" --version --verbose || true
            if [ -f "$active_env/std/dict.wl" ]; then
              sha256sum "$active_env/std/dict.wl"
            fi
          }

          snapshot_processes() {
            local elapsed="$1"
            echo "[heartbeat] elapsed=${elapsed}s"
            powershell.exe -NoProfile -Command \
              'Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like "wlc*" -or $_.ProcessName -like "clang*" -or $_.ProcessName -eq "ld.lld" -or $_.ProcessName -eq "lld-link" } | Sort-Object ProcessName, Id | Format-Table ProcessName, Id, CPU, WorkingSet64, PrivateMemorySize64, StartTime -AutoSize' \
              || true
            find "$temp_dir" -maxdepth 1 -type f -name 'wlc_tmp_*' \
              -printf 'temporary IR: %f %s bytes\n' 2>/dev/null || true
          }

          stop_compiler_processes() {
            powershell.exe -NoProfile -Command \
              'Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like "wlc*" -or $_.ProcessName -like "clang*" -or $_.ProcessName -eq "ld.lld" -or $_.ProcessName -eq "lld-link" } | Stop-Process -Force' \
              || true
          }

          save_temporary_ir() {
            mkdir -p "$source_root/../bootstrap_debug/temp_ir"
            find "$temp_dir" -maxdepth 1 -type f -name 'wlc_tmp_*' \
              -exec cp -f '{}' "$source_root/../bootstrap_debug/temp_ir/" \; 2>/dev/null || true
          }

          run_traced() {
            local label="$1"
            shift
            local log="$source_root/../bootstrap_debug/${label}.log"
            local started
            local elapsed=0

            echo "running: $*"
            "$@" >"$log" 2>&1 &
            local pid=$!
            started=$(date +%s)

            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              elapsed=$(( $(date +%s) - started ))
              snapshot_processes "$elapsed"
              tail -n 20 "$log" || true

              if [ "$elapsed" -ge 900 ]; then
                echo "::error::$label exceeded 15 minutes."
                save_temporary_ir
                stop_compiler_processes
                wait "$pid" || true
                return 124
              fi
            done

            set +e
            wait "$pid"
            local status=$?
            set -e
            cat "$log"
            echo "$label exit code: $status"
            return "$status"
          }

          for commit in $commits; do
            short_sha=$(git rev-parse --short "$commit")
            echo "------------------------------------------------"
            echo "Bootstrapping Commit: $short_sha"
            git checkout --detach "$commit"

            export WL_PATH="$active_env"
            rm -rf "$active_env/std"
            mkdir -p "$active_env/std"
            cp -a std/. "$active_env/std/"

            build_dir="$source_root/../build_$short_sha"
            rm -rf "$build_dir"
            mkdir -p "$build_dir/bin" "$build_dir/std"
            cp -a "$active_env/tools" "$build_dir/tools"

            print_toolchain "$commit"

            run_traced "${short_sha}_stage1" \
              "$active_wlc" src/wlc.wl -o "$build_dir/bin/wlc_temp.exe" -Oz

            cp -a std/. "$build_dir/std/"
            export WL_PATH="$build_dir"
            run_traced "${short_sha}_stage2" \
              "$build_dir/bin/wlc_temp.exe" src/wlc.wl -o "$build_dir/bin/wlc.exe" -Oz

            rm -f "$build_dir/bin/wlc_temp.exe"
            active_wlc="$build_dir/bin/wlc.exe"
            active_env="$build_dir"

            if [ -n "${{ inputs.stop_after }}" ] && [[ "$short_sha" == "${{ inputs.stop_after }}"* ]]; then
              echo "Reached requested stop commit $short_sha."
              break
            fi
          done

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-debug-windows-x64
          path: |
            bootstrap_debug/
            build_*/bin/wlc*.exe
          if-no-files-found: warn
          retention-days: 7
